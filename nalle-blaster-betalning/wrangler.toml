name = "nalle-blaster-betalning"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true

[vars]
# Adressen där spelet ligger. Stripe skickar tillbaka spelaren hit efter köpet.
GAME_URL = "https://linkanbosse.github.io/nalle-blaster/"

# Stripe blir säljare och sköter moms, bedrägerikoll och kundsupport ("true"), eller vanligt köp ("false").
MANAGED_PAYMENTS = "true"
# Stripes skattekod för produkten. Kolla i Stripe vilken kod som passar digitala spelvaror.
TAX_CODE = "txcd_10103100"
