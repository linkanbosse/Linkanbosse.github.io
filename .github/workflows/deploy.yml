name: Deploy to GitHub Pages

# Publicerar webbplatsen. Finns ett npm-projekt (package.json) byggs det till dist/ som förut,
# annars publiceras repot som statiska filer. Statiska mappar som bergpro/ följer alltid med.

on:
  push:
    branches: [main, master]  # Pages-miljön i repot tillåter bara publicering från master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build npm project
        if: hashFiles('package.json') != ''
        run: |
          npm install
          npm run build
          cp -r bergpro dist/bergpro
      - name: Prepare static site
        if: hashFiles('package.json') == ''
        run: |
          mkdir -p dist
          rsync -a --exclude '.git' --exclude '.github' --exclude 'nalle-blaster-betalning' ./ dist/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
