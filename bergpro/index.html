/* --- Egna modeller (användarens anteckningar; ej verifierade, inga förifyllda indatavärden) ---
   Efter oberoende säkerhetsgranskning 2026-10-14: t presenteras inte som tändintervall, statusen följer med
   resultatet överallt, enheter är låsta till anteckningens (B i m, l i kg/m) och precisionen begränsas. */
const SRC_NOTE = 'Användarens egna handskrivna anteckningar (daterade 2024-12-27). Ingen fackkälla angiven.';
const VERIF_NOTE = 'EJ VERIFIERAD. Kontrollerat: v räknat med anteckningens exempelindata återger anteckningens eget exempelvärde för v, och t räknas som kvoten λ/v. Anteckningens λ-exempel är inkonsekvent och har inte avgjorts. Modellens fysikaliska innebörd, enheter och giltighetsområde är inte belagda i någon fackkälla. Kräver granskning av behörig person innan resultat används.';
const UNVERIFIED_NOTICE = 'EJ VERIFIERAD EGEN MODELL – inte dimensioneringsunderlag och inte ett tändintervall. Kräver granskning av behörig person. BergPro ersätter inte behörig sprängteknisk kompetens eller en projektspecifik riskbedömning.';
const MODEL_OPEN = [
  'Anteckningens exempel säger ”λ 40 %” och ”40 % av B = 1,6” med B = 2 m. 40 % av 2 m är 0,8 m, inte 1,6 m. Tolkningen ändrar t med en faktor 2 och har inte avgjorts – ange därför λ själv, i procent av B eller direkt i meter.',
  'Vilken fysikalisk storhet v är har inte fastställts. Bergmassans/försättningens rörelsehastighet, partikelhastighet (vibration) och vågutbredningshastighet är olika storheter.',
  'K gäller bara för de enheter modellen har tagits fram för – enligt anteckningen B i meter och l i kg/m. Därför är B och l låsta till de enheterna.',
  'Exponenterna 1,17 och 0,39 är avlästa från en handskriven anteckning.',
];
/* K per bergart enligt användarens anteckning (2024-12-27): ”gnejs 22, granit 25, kvartsit 27, skiffer 18, alunskiffer 15”. */
const ROCK_K = { gnejs: ['Gnejs', 22], granit: ['Granit', 25], kvartsit: ['Kvartsit', 27], skiffer: ['Skiffer', 18], alunskiffer: ['Alunskiffer', 15] };
const RS = (label, value, unit, sym) => ({ label, value, unit, sym, sig: 3 }); /* begränsad visningsprecision */
fm('blast_v', 'v = K / Bᵃ · lᵇ (egen modell, ej verifierad)', 'model', 'unverified', `v = ${F('<i>K</i>', sup('<i>B</i>', '<i>a</i>'))} · ${sup('<i>l</i>', '<i>b</i>')}`,
  [['v', 'Hastighet enligt anteckningen (”hastigheten på bergmassan”) – storheten är inte fastställd', 'm/s'], ['K', 'Bergartskonstant, anges av användaren eller väljs per bergart enligt anteckningen (gnejs 22, granit 25, kvartsit 27, skiffer 18, alunskiffer 15)', 'enhet enligt källan (gäller för B i m, l i kg/m)'], ['B', 'Försättning', 'm'], ['l', 'Laddningskoncentration', 'kg/m'], ['a', 'Exponent för B (anteckningen: 1,17)', '–'], ['b', 'Exponent för l (anteckningen: 0,39)', '–']],
  'Egen empirisk modell enligt användarens anteckning: v = K / B^1,17 · l^0,39.', 'B > 0, l > 0, K > 0. Giltighetsområdet är okänt – ange det från din källa i kalkylatorn.',
  MODEL_OPEN.join(' '), SRC_NOTE,
  ['egen modell', 'anteckningar', 'bergartskonstant', 'laddningskoncentration'], VERIF_NOTE);
fm('blast_t', 'Kvot t = λ / v (egen modell – inte ett tändintervall)', 'model', 'unverified', `t = ${F('λ', '<i>v</i>')}`,
  [['t', 'Kvot λ/v enligt anteckningen (”reell tid”) – inte ett tändintervall', 's'], ['λ', 'Önskad förflyttning före nästa rad, anges av användaren i % av B eller i m', 'm'], ['v', 'Hastighet enligt modellen ovan', 'm/s']],
  'Egen modell enligt användarens anteckning: t = λ / v.', 'v > 0, λ > 0.',
  MODEL_OPEN.slice(0, 2).join(' ') + ' BergPro avrundar inte till tändarsteg och ger inga förslag på tändsekvens.', SRC_NOTE,
  ['egen modell', 'anteckningar'], VERIF_NOTE);
const RANGE = (id, label, unit) => ({ id, label, type: 'range', opt: true, unitLabel: unit, hint: 'Valfritt. Skriv min–max från din källa, t.ex. ”a–b”. Appen fyller inte i något.' });
calc({ id: 'blast_model', f: 'blast_v', fs: ['blast_v', 'blast_t'], cat: 'model', title: 'Egen modell: v och kvoten λ/v (ej verifierad)', desc: 'v = K / B^a · l^b och t = λ / v enligt dina anteckningar. Ej verifierad modell – inte dimensioneringsunderlag och inte ett tändintervall. Alla värden anger du själv.', syn: ['egen modell', 'anteckningar', 'bergartskonstant', 'laddningskoncentration', 'bergart', 'granit', 'gnejs', 'kvartsit', 'skiffer', 'alunskiffer'], notice: MODEL_OPEN,
  inputs: [SEL('rock', 'Bergart (föreslår K enligt dina anteckningar)', [['', 'Ingen – jag anger K själv'], ...Object.entries(ROCK_K).map(([k, r]) => [k, `${r[0]} – K = ${r[1]} enligt anteckningen`])], { def: '', fills: { target: 'K', values: Object.fromEntries(Object.entries(ROCK_K).map(([k, r]) => [k, r[1]])) }, hint: 'Värdena kommer från din handskrivna anteckning och är inte verifierade. Du kan ändra K efteråt.' }),
    I('K', 'Bergartskonstant K', { noConv: 1, gt0: 1, opt: 1, unitLabel: 'enl. källan', hint: 'Fylls i när du väljer bergart, eller anges av dig. Gäller bara för B i m och l i kg/m.' }),
    I('B', 'Försättning B', { noConv: 1, gt0: 1, unitLabel: 'm', hint: 'Anges i meter – modellen förutsätter B i m.' }),
    I('l', 'Laddningskoncentration l', { noConv: 1, gt0: 1, unitLabel: 'kg/m', hint: 'Kilogram per laddad meter.' }),
    I('a', 'Exponent för B (a)', { noConv: 1, gt0: 1, def: '1,17', unitLabel: '–', hint: 'Förifylld från anteckningen. Ändra om din källa anger annat.' }),
    I('b', 'Exponent för l (b)', { noConv: 1, gt0: 1, def: '0,39', unitLabel: '–', hint: 'Förifylld från anteckningen. Ändra om din källa anger annat.' }),
    I('lamPct', 'λ som andel av försättningen B', { noConv: 1, opt: 1, gt0: 1, unitLabel: '% av B', hint: 'Ange λ antingen här eller som längd nedan – inte båda. Lämna båda tomma för att bara få v.' }),
    I('lamM', 'λ som längd', { noConv: 1, opt: 1, gt0: 1, unitLabel: 'm' }),
    RANGE('rB', 'Giltigt intervall för B enligt din källa', 'm'), RANGE('rl', 'Giltigt intervall för l enligt din källa', 'kg/m'), RANGE('rK', 'Giltigt intervall för K enligt din källa', 'enl. källan')],
  compute(v) {
    if (v.lamPct !== undefined && v.lamM !== undefined) throw new CalcError('Ange λ antingen i procent av B eller som längd – inte båda.', 'lamM');
    const rock = ROCK_K[v.rock];
    if (v.K === undefined && !rock) throw new CalcError('Välj bergart eller ange K.', 'K');
    const K = v.K !== undefined ? v.K : rock[1], kNote = [];
    if (rock && v.K === undefined) kNote.push(`K = ${fmt(K)} för ${rock[0].toLowerCase()} enligt dina anteckningar (ej verifierat).`);
    else if (rock && v.K !== rock[1]) kNote.push(`Du har angett K = ${fmt(v.K)}; anteckningens värde för ${rock[0].toLowerCase()} är ${rock[1]}. Ditt värde används.`);
    else if (rock) kNote.push(`K = ${fmt(K)} för ${rock[0].toLowerCase()} enligt dina anteckningar (ej verifierat).`);
    v = Object.assign({}, v, { K });
    const vv = v.K / Math.pow(v.B, v.a) * Math.pow(v.l, v.b);
    if (!Number.isFinite(vv) || !(vv > 0)) throw new CalcError('v kan inte beräknas med de angivna värdena.');
    const f3 = x => Format.num(x, 3);
    const res = [RS('v enligt egen modell, ej verifierad', vv, 'm/s', '')];
    const steps = [`v = K / B^a · l^b = ${fmt(v.K)} / ${fmt(v.B)}^${fmt(v.a)} · ${fmt(v.l)}^${fmt(v.b)} ≈ ${f3(vv)} m/s`];
    const w = [UNVERIFIED_NOTICE, ...kNote];
    if (v.lamPct !== undefined || v.lamM !== undefined) {
      const lam = v.lamM !== undefined ? v.lamM : v.lamPct / 100 * v.B, t = lam / vv;
      if (!Number.isFinite(t)) throw new CalcError('Kvoten λ/v kan inte beräknas med de angivna värdena.');
      if (v.lamPct !== undefined && v.lamPct > 100) w.push('λ är större än försättningen B (över 100 %) – kontrollera definitionen av λ.');
      if (v.lamM !== undefined && v.lamM > v.B) w.push('λ är större än försättningen B – kontrollera definitionen av λ.');
      res.push(RS('Förflyttning', lam, 'm', 'λ'), RS('Kvot λ/v – inte ett tändintervall', t, 's', 't'));
      steps.push(v.lamM !== undefined ? `λ = ${fmt(lam)} m (angiven längd)` : `λ = ${fmt(v.lamPct)} % · ${fmt(v.B)} m = ${f3(lam)} m`, `t = λ / v ≈ ${f3(lam)} / ${f3(vv)} ≈ ${f3(t)} s`);
      w.push('Värdet t är inte ett förslag på tändintervall. BergPro avrundar inte till tändarsteg och ger inga förslag på tändsekvens.');
    }
    [['rB', 'B', v.B, 'm'], ['rl', 'l', v.l, 'kg/m'], ['rK', 'K', v.K, '']].forEach(([r, n, x, u]) => { if (v[r] && (x < v[r][0] || x > v[r][1])) w.push(`${n} = ${fmt(x)} ${u} ligger utanför det giltighetsområde du angett (${fmt(v[r][0])}–${fmt(v[r][1])} ${u}).`.replace('  ', ' ')); });
    w.push('Noggrannheten är okänd – resultaten visas med 3 gällande siffror. Interna beräkningar använder full precision.');
    return { results: res, steps, warnings: w };
  } });

/* Koppla formler ↔ kalkylatorer */
/** Äldre poster: värden som sparats med en enhet för ett fält som nu har låst enhet räknas om (säkerhetsgranskning N2).
    Returnerar { raw, units, notes } där notes beskriver omräkningarna. */
function migrateLegacy(c, raw, units) {
  raw = Object.assign({}, raw || {}); units = Object.assign({}, units || {}); const notes = [];
  if (!c) return { raw, units, notes };
  for (const inp of c.inputs) {
    const uk = units[inp.id];
    if (inp.unitGroup || !uk || inp.type !== 'num') continue;
    const g = Object.keys(UNITS).find(k => UNITS[k].base === inp.unitLabel && UNITS[k].list.some(u => u[0] === uk));
    const p = Parse.num(raw[inp.id]);
    if (g && !p.error && !p.empty) {
      const nv = Units.convert(g, p.value, uk, UNITS[g].list.find(u => u[2] === 1)[0]);
      if (uk !== UNITS[g].list.find(u => u[2] === 1)[0]) notes.push(`Äldre post: ${inp.label} angavs som ${Format.num(p.value)} ${Units.label(g, uk)} och har räknats om till ${Format.num(nv)} ${inp.unitLabel}.`);
      raw[inp.id] = Format.raw(nv);
    } else if (!g) notes.push(`Äldre post: enheten för ${inp.label} (${uk}) stöds inte längre – kontrollera värdet.`);
    delete units[inp.id];
  }
  return { raw, units, notes };
}
/** Resultat att visa för en lagrad post. För ej verifierade modeller räknas resultatet om från (migrerade) indata
    så att aktuella etiketter och begränsad precision alltid används; annars visas de lagrade resultaten. */
function shownResults(rec) {
  const c = CALC[rec.calc];
  if (c && rec.raw && isUnverified(rec.calc)) {
    try { const mg = migrateLegacy(c, rec.raw, rec.units); const r = Engine.run(c, mg.raw, mg.units); if (r.ok) return r.out.results; } catch (e) { /* visa lagrat */ }
    return (rec.results || []).map(x => Object.assign({ sig: 3 }, x));
  }
  return rec.results || [];
}
/** Kalkylatorer vars formel är ej verifierad – deras status ska följa med resultatet överallt. */
const isUnverified = id => { const c = CALC[id]; return !!(c && (c.fs || [c.f]).some(f => FORM[f] && FORM[f].type === 'unverified')); };
const formulaMeta = id => { const c = CALC[id], f = c && FORM[c.f]; return f ? { type: f.type, typeLabel: FTYPES[f.type][0], ver: f.ver, app: (typeof APP_VERSION !== 'undefined' ? APP_VERSION : '') } : null; };
const CALC = Object.fromEntries(CALCS.map(c => [c.id, c]));
const FORM = Object.fromEntries(FORMULAS.map(f => [f.id, f]));
CALCS.forEach(c => { if (FORM[c.f]) FORM[c.f].calc = c.id; });
/* Tillämpa granskningsregistret */
FORMULAS.forEach(f => {
  const r = REVIEW[f.id];
  if (!r) return;
  const { note, ...fields } = r;
  const changed = Object.keys(fields).some(k => JSON.stringify(f[k]) !== JSON.stringify(fields[k])) || /Ändrat|Tillägg|borttaget/.test(note);
  Object.assign(f, fields);
  f.review = { date: REVIEW_DATE, by: REVIEW_BY, note };
  if (changed) f.ver = '1.1';
});
FORM.hooke.calc = 'young'; FORM.blast_t.calc = 'blast_model';
FORM.expr.tool = 'quick'; FORM.units_conv.tool = 'units';

/* ---------- Beräkningsmotor ---------- */
const Engine = {
  /** Läser och validerar en enskild inmatning. Skriver till v (basenheter) och returnerar. */
  read(inp, raw, units, v) {
    const key = inp.id, rv = raw[key];
    const group = inp.unitDyn ? inp.unitDyn.groups[raw[inp.unitDyn.dep] || ''] : inp.unitGroup;
    const ukey = group ? (units[key] && UNITS[group].list.some(u => u[0] === units[key]) ? units[key] : (inp.unitDyn ? inp.unitDyn.defs[raw[inp.unitDyn.dep]] : inp.unit) || Units.firstKey(group)) : null;
    v._ul[key] = group ? Units.label(group, ukey) : (inp.unitLabel || '');
    v._units[key] = ukey;
    const conv = x => (group && !inp.noConv ? Units.toBase(group, ukey, x) : x);
    const pos = (b, who) => {
      if (inp.gt0 && !(b > 0)) return `${who}Måste vara större än 0.`;
      if (inp.ge0 && b < 0) return `${who}Får inte vara negativt.`;
      if (inp.ne0 && b === 0) return `${who}Får inte vara 0 (division med noll).`;
      if (inp.check) { const m = inp.check(b); if (m) return who + m; }
      return null;
    };
    if (inp.type === 'select') {
      const val = rv === undefined || rv === '' ? (inp.def !== undefined ? inp.def : inp.options[0][0]) : rv;
      if (!inp.options.some(o => o[0] === val)) throw new CalcError('Ogiltigt val.', key);
      v[key] = val; return;
    }
    if (inp.type === 'text') { v[key] = String(rv == null ? '' : rv).trim().slice(0, 40); return; }
    if (inp.type === 'range') {
      const str = String(rv == null ? '' : rv).trim();
      if (!str) { v[key] = undefined; return; }
      const m = /^([0-9][0-9 ]*(?:[.,][0-9]+)?|[.,][0-9]+)\s*(?:–|—|-|till|\.\.|;)\s*([0-9][0-9 ]*(?:[.,][0-9]+)?|[.,][0-9]+)$/i.exec(str);
      if (!m) throw new CalcError('Skriv intervallet som två tal med bindestreck emellan (min–max).', key);
      const a = Parse.num(m[1]), b = Parse.num(m[2]);
      if (a.error || b.error) throw new CalcError(a.error || b.error, key);
      if (a.value > b.value) throw new CalcError('Minvärdet är större än maxvärdet.', key);
      v[key] = [a.value, b.value]; return;
    }
    if (inp.type === 'num') {
      const r = Parse.num(rv);
      if (r.error) throw new CalcError(r.error, key);
      if (r.empty) { if (inp.opt) { v[key] = inp.defVal; v._raw[key] = inp.defVal; return; } throw new CalcError('Fyll i ett värde.', key); }
      if (inp.int && !Number.isInteger(r.value)) throw new CalcError('Måste vara ett heltal.', key);
      const b = conv(r.value);
      if (!Number.isFinite(b)) throw new CalcError('Värdet är för stort.', key);
      const m = pos(b, ''); if (m) throw new CalcError(m, key);
      v[key] = b; v._raw[key] = r.value; return;
    }
    if (inp.type === 'list') {
      const r = Parse.list(rv);
      if (r.errors.length) throw new CalcError(r.errors.slice(0, 2).join(' · ') + (r.errors.length > 2 ? ` … (${r.errors.length} fel)` : ''), key);
      const min = inp.min || 1;
      if (r.values.length < min) throw new CalcError(`Ange minst ${min} värde${min > 1 ? 'n' : ''} (du har angett ${r.values.length}).`, key);
      if (r.values.length > 20000) throw new CalcError('För många värden (max 20 000).', key);
      const out = r.values.map(conv);
      for (let i = 0; i < out.length; i++) { const m = pos(out[i], `Värde ${i + 1}: `); if (m) throw new CalcError(m, key); }
      v[key] = out; v._raw[key] = r.values; return;
    }
    if (inp.type === 'pairs') {
      const r = Parse.pairs(rv);
      if (r.errors.length) throw new CalcError(r.errors.slice(0, 2).join(' · '), key);
      if (r.rows.length < (inp.min || 1)) throw new CalcError(`Ange minst ${inp.min || 1} rader (du har angett ${r.rows.length}).`, key);
      const fs = inp.cols.map((cdef, k) => { const uk = units[key + '.' + k]; return Units.factor(cdef.unitGroup, uk && UNITS[cdef.unitGroup].list.some(u => u[0] === uk) ? uk : cdef.unit); });
      const rows = r.rows.map(row => row.map((x, k) => x * fs[k]));
      for (let i = 0; i < rows.length; i++) {
        for (let k = 0; k < 2; k++) {
          const cd = inp.cols[k];
          if (cd.ge0 && rows[i][k] < 0) throw new CalcError(`Rad ${i + 1}: ${cd.label} får inte vara negativ.`, key);
          if (cd.asc && i > 0 && !(rows[i][k] > rows[i - 1][k])) throw new CalcError(`Rad ${i + 1}: ${cd.label} måste vara större än föregående rad (stigande ordning).`, key);
        }
      }
      v[key] = rows; return;
    }
  },
  /** Kör en kalkylator. raw: {id: text}, units: {id: enhetsnyckel}. */
  run(calc, raw, units) {
    raw = Object.assign({}, raw || {}); units = units || {};
    for (const inp of calc.inputs) if (inp.type === 'select' && (raw[inp.id] === undefined || raw[inp.id] === '')) raw[inp.id] = inp.def !== undefined ? inp.def : inp.options[0][0];
    const v = { _units: {}, _ul: {}, _raw: {} }, errors = {};
    for (const inp of calc.inputs) {
      try { Engine.read(inp, raw, units, v); } catch (e) { if (e instanceof CalcError) errors[e.field || inp.id] = e.message; else throw e; }
    }
    if (Object.keys(errors).length) return { ok: false, errors };
    const ctx = {
      disp(id) { const x = v._raw[id]; return `${Format.num(Array.isArray(x) ? x[0] : x)}${v._ul[id] ? ' ' + v._ul[id] : ''}`; },
    };
    try {
      const out = calc.compute(v, ctx);
      for (const r of out.results) if (typeof r.value === 'number' && !Number.isFinite(r.value)) throw new CalcError('Resultatet är inte ett ändligt tal – kontrollera indata.');
      out.warnings = out.warnings || []; out.steps = out.steps || [];
      return { ok: true, out };
    } catch (e) {
      if (e instanceof CalcError) return { ok: false, errors: { [e.field || '_form']: e.message } };
      throw e;
    }
  },
  /** Gör resultat till ren text. */
  text(calc, out) {
    return out.results.filter(r => !r.alt).map(r => `${r.label}${r.sym ? ' (' + r.sym + ')' : ''} = ${r.text !== undefined ? r.text : Format.num(r.value, r.sig)}${r.unit ? ' ' + r.unit : ''}`).join('\n');
  },
};

const Search = {
  items: null,
  build() {
    const it = [];
    CALCS.forEach(c => it.push({ kind: 'calc', id: c.id, title: c.title, cat: c.cat, desc: c.desc, syn: c.syn || [], href: '#/calc/' + c.id, ic: CAT[c.cat].ic, extra: (FORM[c.f] ? FORM[c.f].desc + ' ' + FORM[c.f].name : '') }));
    FORMULAS.forEach(f => it.push({ kind: 'formula', id: f.id, title: f.name, cat: f.cat, desc: f.desc, syn: f.syn, href: '#/formula/' + f.id, ic: 'book', extra: f.vars.map(v => v[1]).join(' ') }));
    TOOLS.forEach(t => it.push({ kind: 'tool', id: t.id, title: t.n, cat: t.cat, desc: t.d, syn: t.syn, href: t.href, ic: t.ic, extra: '' }));
    CATS.forEach(c => it.push({ kind: 'cat', id: c.id, title: 'Kategori: ' + c.n, cat: c.id, desc: c.d, syn: c.syn, href: '#/cat/' + c.id, ic: c.ic, extra: '' }));
    /* Friskrivningar som ”inte ett tändintervall” får inte göra en post sökbar på just de orden (säkerhetsgranskning N1). */
    const strip = s => String(s || '').replace(/(inte|ej) (ett |en )?(dimensioneringsunderlag|tändintervall|förslag på tändintervall)/gi, ' ').replace(/tändarsteg|tändsekvens/gi, ' ');
    it.forEach(x => { x._t = Util.norm(strip(x.title)); x._s = Util.norm(x.syn.join(' ')); x._c = Util.norm(CAT[x.cat].n); x._d = Util.norm(strip(x.desc)); x._e = Util.norm(strip(x.extra)); });
    this.items = it;
  },
  /** Söker i namn, kategori, synonymer, beskrivning och relaterade begrepp. */
  query(q, limit) {
    if (!this.items) this.build();
    const toks = Util.norm(q).split(/\s+/).filter(Boolean);
    if (!toks.length) return [];
    const out = [];
    for (const x of this.items) {
      let score = 0, ok = true;
      for (const t of toks) {
        const variants = [t]; if (t.length >= 5) variants.push(t.slice(0, -2)); if (t.length >= 6) variants.push(t.slice(0, -3));
        let best = 0;
        for (const [k, tv] of variants.entries()) {
          const pen = k === 0 ? 1 : 0.6;
          if (x._t.startsWith(tv)) best = Math.max(best, 15 * pen); else if (x._t.includes(' ' + tv)) best = Math.max(best, 12 * pen); else if (x._t.includes(tv)) best = Math.max(best, 10 * pen);
          if (x._s.includes(tv)) best = Math.max(best, 8 * pen);
          if (x._c.includes(tv)) best = Math.max(best, 5 * pen);
          if (x._e.includes(tv)) best = Math.max(best, 3 * pen);
          if (x._d.includes(tv)) best = Math.max(best, 2 * pen);
        }
        if (!best) { ok = false; break; }
        score += best;
      }
      if (ok) out.push({ x, score: score + (x.kind === 'calc' ? 1 : x.kind === 'tool' ? 0.5 : 0) });
    }
    out.sort((a, b) => b.score - a.score);
    return out.slice(0, limit || 40).map(o => o.x);
  },
};

function calcSubmit(c, silent) {

function ffield(f, val, pre) {
  const id = pre + f.id;
  const lab = `<label for="${id}">${esc(f.label)}${f.req ? '' : ' <span class="u">(valfritt)</span>'}</label>`;
  const v = val === undefined || val === null ? '' : val;
  let ctl;
  if (f.type === 'select') ctl = `<select id="${id}">${f.options.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  else if (f.type === 'project') ctl = `<select id="${id}"><option value="">– Inget projekt –</option>${Store.data.projects.map(p => `<option value="${p.id}" ${p.id === v ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>`;
  else if (f.type === 'area') ctl = `<textarea id="${id}" rows="3" style="min-height:90px;font-family:var(--font)" maxlength="2000">${esc(v)}</textarea>`;
  else if (f.type === 'datetime') ctl = `<input id="${id}" type="datetime-local" value="${esc(v || nowLocal())}">`;
  else if (f.type === 'date') ctl = `<input id="${id}" type="date" value="${esc(v || (f.today ? new Date().toISOString().slice(0, 10) : ''))}">`;
  else if (f.type === 'num') ctl = `<input id="${id}" type="text" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(typeof v === 'number' ? Format.raw(v) : v)}" placeholder="${esc(f.ph || '')}">`;
  else ctl = `<input id="${id}" type="text" maxlength="300" autocomplete="off" value="${esc(v)}" placeholder="${esc(f.ph || '')}">`;
  return `<div class="field" id="w-${id}">${lab}${ctl}<div class="msg" id="m-${id}" role="alert"></div></div>`;
}
function readFields(fields, pre) {
  const rec = {}, errors = {};
  fields.forEach(f => {
    const el = $('#' + pre + f.id); if (!el) return;
    const v = el.value.trim();
    if (f.type === 'num') {
      if (v === '') { if (f.req) errors[f.id] = 'Fyll i ett värde.'; return; }
      const r = Parse.num(v);
      if (r.error) { errors[f.id] = r.error; return; }
      if (f.ge0 && r.value < 0) { errors[f.id] = 'Får inte vara negativt.'; return; }
      if (f.gt0 && !(r.value > 0)) { errors[f.id] = 'Måste vara större än 0.'; return; }
      rec[f.id] = r.value; return;
    }
    if (f.req && v === '') { errors[f.id] = 'Fyll i det här fältet.'; return; }
    if (f.type === 'select' && !f.options.includes(v)) { errors[f.id] = 'Ogiltigt val.'; return; }
    rec[f.id] = v.slice(0, f.type === 'area' ? 2000 : 300);
  });
  return { rec, errors };
}
function showFieldErrors(fields, errors, pre) {
  let first = null;
  fields.forEach(f => {
    const w = $('#w-' + pre + f.id), m = $('#m-' + pre + f.id); if (!w) return;
    w.classList.toggle('bad', !!errors[f.id]); if (m) m.textContent = errors[f.id] || '';

}

/** Statusrader som alltid följer med ett resultat ut ur appen (säkerhetsgranskning H3, L7). */
function statusText(h) {
  const c = CALC[h.calc], f = c && FORM[c.f]; if (!f) return '';
  const m = h.meta;
  let o = `Formeltyp: ${FTYPES[f.type][0]}${m && m.ver ? ` (formelversion ${m.ver}, BergPro ${m.app || '?'} vid beräkningen)` : ' (status vid beräkningen okänd – visar nuvarande)'}\nVerifieringsstatus: ${f.verif}`;
  const legacy = migrateLegacy(c, h.raw, h.units).notes;

    const extra = (h.warn || []).filter(w => w !== UNVERIFIED_NOTICE);
    o = `*** ${UNVERIFIED_NOTICE} ***\n` + o + (extra.length ? '\nVarningar:\n- ' + extra.join('\n- ') : '');

}

const CONV_GROUPS = ['length', 'area', 'volume', 'mass', 'density', 'pressure', 'force', 'speed', 'time', 'power', 'energy', 'accel', 'angle', 'freq'];
function convHTML() {
  const c = App.conv, g = UNITS[c.g];
  if (!g.list.some(u => u[0] === c.from)) c.from = g.list[0][0];
  if (!g.list.some(u => u[0] === c.to)) c.to = g.list[Math.min(1, g.list.length - 1)][0];
  const p = Parse.num(c.v);
  let out;
  if (p.error) out = noteBox('err', esc(p.error));
  else if (p.empty) out = noteBox('info', 'Skriv ett värde att omvandla.');
  else {
    const r = Units.convert(c.g, p.value, c.from, c.to);
    if (!Number.isFinite(r)) out = noteBox('err', 'Resultatet är inte ett ändligt tal.');
    else {
      const fl = Units.label(c.g, c.from), tl = Units.label(c.g, c.to);
      out = `<section class="result" aria-label="Resultat"><div class="lbl">${esc(Format.num(p.value))} ${esc(fl)} =</div><div class="big">${esc(Format.num(r))}<small>${esc(tl)}</small></div>
      <div class="actions"><button class="btn sm" type="button" data-act="copyconv" data-t="${esc(Format.num(p.value) + ' ' + fl + ' = ' + Format.num(r) + ' ' + tl)}">${ic('copy')}Kopiera</button></div></section>
      <div class="card" style="margin-top:14px"><h2 style="margin-bottom:8px">${esc(Format.num(p.value))} ${esc(fl)} i alla enheter</h2><div class="tblwrap"><table class="tbl"><tbody>${g.list.map(u => `<tr><td>${esc(u[1])}</td><td class="num">${esc(Format.num(Units.convert(c.g, p.value, c.from, u[0])))}</td></tr>`).join('')}</tbody></table></div></div>`;
    }
  }
  const warn = c.g === 'pressure' ? noteBox('warn', 'Tryck/spänning (kraft per area) är inte samma sak som kraft (N) eller energi (J). Enheten kgf/cm² är en kraftbaserad enhet.') : c.g === 'mass' ? noteBox('info', 'Massa (kg) är inte kraft (N). Kraft omvandlas i gruppen Kraft.') : '';
  return out + (warn ? `<div style="margin-top:14px">${warn}</div>` : '');
}

/* ---------- Rapporter ---------- */
/** Gör formelns HTML-notation till ren text (för txt/csv). */
function plainExpr(html) {
  let s = String(html);
  for (let i = 0; i < 6; i++) s = s.replace(/<span class="frac"><span>((?:(?!<\/span>).)*)<\/span><span>((?:(?!<\/span>).)*)<\/span><\/span>/g, '($1)/($2)');
  s = s.replace(/<span class="rt">(.*?)<\/span>/g, '($1)').replace(/<sub>(.*?)<\/sub>/g, '_$1').replace(/<sup>(.*?)<\/sup>/g, '^$1').replace(/<[^>]+>/g, '');
  return s.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/\s+/g, ' ').trim();
}
/** Ett beräkningsblock för rapporter. Status och varningar följer alltid med (säkerhetsgranskning M1, L7). */
function calcBlock(rec) {
  const c = CALC[rec.calc], fl = c ? (c.fs || [c.f]).map(id => FORM[id]).filter(Boolean) : [], f = fl[0];
  const unv = isUnverified(rec.calc), title = rec.title || (c && c.title) || rec.calc;
  /* Kontrollräkna lagrat resultat mot indata (fångar ändrade eller importerade poster). */
  let mismatch = '';
  const mg = migrateLegacy(c, rec.raw, rec.units);
  if (c && rec.raw) {
    try {
      const r = Engine.run(c, mg.raw, mg.units), st = (rec.results || []).filter(x => !x.alt && typeof x.value === 'number'), nw = r.ok ? r.out.results.filter(x => !x.alt && typeof x.value === 'number') : [];
      if (!r.ok || st.some((x, i) => !nw[i] || Math.abs(x.value - nw[i].value) > 1e-9 * Math.max(1, Math.abs(nw[i].value)))) mismatch = 'Lagrat resultat stämmer inte med omräkning från indata – kontrollera posten.';
    } catch (e) { mismatch = 'Resultatet kunde inte kontrollräknas.'; }
  }
  const warnings = (rec.warn && rec.warn.length ? rec.warn.slice() : (unv ? [UNVERIFIED_NOTICE] : [])).concat(mg.notes, mismatch ? [mismatch] : []);
  return {
    title, origin: c && title !== c.title ? c.title : '', t: rec.t, note: rec.note || '', unv,
    formulas: fl.map(x => ({ name: x.name, plain: plainExpr(x.expr), html: x.expr })),
    ins: rec.ins || [], results: shownResults(rec).filter(r => !r.alt), warnings,
    src: fl.map(x => x.src).filter((v, i, arr) => arr.indexOf(v) === i).join(' | '),
    verif: f ? `${FTYPES[f.type][0]} – ${f.verif}${f.review ? ` Granskning ${f.review.date}: ${f.review.note}` : ''}` : '',
    atCalc: rec.meta ? `Vid beräkningen: ${rec.meta.typeLabel}, formelversion ${rec.meta.ver}, BergPro ${rec.meta.app || '?'}.` : 'Status vid beräkningen okänd (äldre post) – nuvarande status visas.',
  };
}
function projectModel(p) {
  const L = projLinked(p), costs = p.costs || [], total = Util.sum(costs.map(c => c.amount));
  const kn = [];
  if (costs.length && p.drillm > 0) kn.push(['Kostnad per borrmeter', total / p.drillm, 'kr/m']);
  if (costs.length && p.vol > 0) kn.push(['Kostnad per m³', total / p.vol, 'kr/m³']);
  return { name: p.name, date: p.date || today(), desc: p.desc || '', notes: p.notes || '', blocks: L.saved.map(calcBlock), meas: L.journal, regs: L.notes, costs, total, kn };
}
function reportTXT(m) {
  const o = [];
  o.push(m.name ? `PROJEKT: ${m.name}` : 'BERGPRO – RESULTAT', `Datum: ${m.date}`);
  if (m.blocks.some(b => b.unv)) o.push('', `OBS: Rapporten innehåller resultat från EJ VERIFIERAD egen modell (markerade nedan).`);
  if (m.desc) o.push(`Beskrivning: ${m.desc}`);
  if (m.notes) o.push(`Anteckningar: ${m.notes}`);
  m.blocks.forEach((b, i) => {
    o.push('', `${'='.repeat(50)}`, `${i + 1}. ${b.title}`);
    if (b.unv) o.push(`*** ${UNVERIFIED_NOTICE} ***`);
    if (b.origin) o.push(`Beräkning: ${b.origin}`);
    b.formulas.forEach(f => o.push(`Formel: ${f.plain}`));
    if (b.ins.length) { o.push('Indata:'); b.ins.forEach(x => o.push(`  ${x.l}: ${x.v}${x.u ? ' ' + x.u : ''}`)); }
    o.push('Resultat:'); b.results.forEach(r => o.push(`  ${r.label}${r.sym ? ' (' + r.sym + ')' : ''} = ${resultLine(r)}`));
    const extra = b.warnings.filter(w => w !== UNVERIFIED_NOTICE); if (extra.length) { o.push('Varningar:'); extra.forEach(w => o.push(`  - ${w}`)); }
    if (b.note) o.push(`Anteckning: ${b.note}`);
    if (b.src) o.push(`Källa: ${b.src}`);
    if (b.verif) o.push(`Verifieringsstatus: ${b.verif}`);
    o.push(b.atCalc);
  });
  if (m.meas && m.meas.length) { o.push('', '=== MÄTRESULTAT ==='); m.meas.forEach(j => o.push(`${REGS.journal.title(j)} | ${REGS.journal.sub(j)}`)); }
  if (m.regs && m.regs.length) { o.push('', '=== REGISTER OCH ANTECKNINGAR ==='); m.regs.forEach(n => o.push(`${n.reg.title}: ${n.reg.sub(n.r)}`)); }
  if (m.costs && m.costs.length) { o.push('', '=== KOSTNADER (kr) ==='); m.costs.forEach(c => o.push(`${c.label}: ${Format.num(c.amount)}`)); o.push(`Summa: ${Format.num(m.total)}`); m.kn.forEach(k => o.push(`${k[0]}: ${Format.num(k[1])} ${k[2]}`)); }
  o.push('', 'Skapad med BergPro. Beräkningshjälp – ersätter inte kontroll av behörig person eller projektspecifik riskbedömning.');
  return o.join('\r\n');
}

  });
  if (m.meas && m.meas.length) h += `<div class="block"><h2>Mätresultat</h2>${tbl(['Typ', 'Värde', 'Enhet', 'Art', 'Komponent', 'Mättid', 'Plats', 'Instrument'], m.meas.map(j => [j.kind, Format.num(j.value), j.unit, j.measure || '', j.comp || '', (j.time || '').replace('T', ' '), j.place || '', j.instrument || '']))}</div>`;
  if (m.regs && m.regs.length) h += `<div class="block"><h2>Register och anteckningar</h2>${tbl(['Register', 'Post'], m.regs.map(n => [n.reg.title, n.reg.sub(n.r) || '']))}</div>`;
  if (m.costs && m.costs.length) h += `<div class="block"><h2>Kostnader</h2>${tbl(['Post', 'Belopp (kr)'], m.costs.map(c => [c.label, Format.num(c.amount)]).concat([['Summa', Format.num(m.total)]], m.kn.map(k => [k[0], Format.num(k[1]) + ' ' + k[2]])))}</div>`;
  return h + `<div class="foot">Skapad med BergPro ${APP_VERSION} ${esc(Format.dt(Date.now()))}. Beräkningshjälp som inte ersätter kontroll mot gällande krav, projektspecifika data eller bedömning av behörig person.</div>`;
}
function printDoc(html) {
  const root = $('#printRoot'); root.innerHTML = html; document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); root.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  toast('Välj ”Spara som PDF” i utskriftsdialogen för att få en PDF-fil.');
  setTimeout(() => { try { window.print(); } catch (e) { done(); toast('Utskrift stöds inte i den här miljön.', true); } }, 400);
}
const SERIES_KIND = { 'Vibration – hastighet': 'vel', 'Vibration – acceleration': 'acc', 'Vibration – förskjutning': 'disp', 'Luftstötvåg (tryck)': 'press' };
function seriesDraft(kindLabel, unit, vals) {
  let kind = SERIES_KIND[kindLabel] || 'other', units = {}, unitTxt = '';
  if (kind !== 'other') {
    const grp = KINDS[kind][1], nu = Util.norm(unit);
    const u = UNITS[grp].list.find(x => Util.norm(x[1]) === nu || x[0] === nu);
    if (u) units.x = u[0]; else { kind = 'other'; unitTxt = unit; }
  } else unitTxt = unit;
  return { raw: { kind, x: vals.join(' '), unitTxt }, units, auto: true };
}

/* ---------- Åtgärder ---------- */
function curCalc() { const f = $('#calcForm'); return f ? CALC[f.dataset.calc] : null; }
function saveResultDialog() {
  const c = curCalc();
  if (!c || !App.last || App.last.calc !== c.id) { toast('Beräkna först.', true); return; }
  const unv = isUnverified(c.id), PREFIX = '[EJ VERIFIERAD egen modell] ';
  const d = modal({ title: 'Spara resultat', body: `${unv ? `<div class="note err" style="margin-bottom:12px">${ic('alert')}<div>${esc(UNVERIFIED_NOTICE)} Namnet får prefixet ”${esc(PREFIX.trim())}”.</div></div>` : ''}<div class="form"><div class="field"><label for="sv-t">Namn</label><input id="sv-t" type="text" maxlength="80" value="${esc(c.title)}"></div>
    <div class="field"><label for="sv-p">Projekt <span class="u">(valfritt)</span></label><select id="sv-p"><option value="">– Inget projekt –</option>${Store.data.projects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="sv-n">Anteckning <span class="u">(valfritt)</span></label><input id="sv-n" type="text" maxlength="300"></div></div>`,
    actions: [{ label: 'Avbryt' }, { label: 'Spara', cls: 'primary', onClick: dd => {
      const L = App.last, slim = L.out.results.map(x => ({ label: x.label, sym: x.sym, value: x.value, unit: x.unit, text: x.text, alt: x.alt, sig: x.sig }));
      let title = ($('#sv-t', dd).value.trim() || c.title).slice(0, 80);
      if (unv && !title.startsWith(PREFIX)) title = PREFIX + title;
      Store.add('saved', { calc: c.id, title, raw: L.raw, units: L.units, results: slim, ins: L.ins, warn: L.out.warnings, meta: formulaMeta(c.id), note: $('#sv-n', dd).value.trim(), project: $('#sv-p', dd).value || '' });
      toast(Store.ok ? 'Resultatet sparades' : 'Sparat tillfälligt (lagring ej tillgänglig)');
    } }] });
  return d;
}
function lastRecord() { const c = curCalc(); if (!c || !App.last || App.last.calc !== c.id) return null; const L = App.last; return { calc: c.id, title: c.title, ins: L.ins, results: L.out.results, raw: L.raw, units: L.units, warn: L.out.warnings, meta: formulaMeta(c.id), t: L.t, note: '' }; }
function clearAllData() {
  confirmBox('Radera all lokal data?', 'Alla historikposter, sparade resultat, projekt, journaler, favoriter och inställningar tas bort. Det går inte att ångra. Exportera först om du vill behålla dem.', 'Radera allt', () => {
    Store.data = DEFAULT_DATA(); Store.save(); /* nyckeln behålls (tom) så att nästa start inte räknas som första start */
    document.documentElement.dataset.theme = 'dark'; CFG.sig = 6; App.drafts = {}; App.last = null; toast('All data raderad'); render();
  });
}
function importDialog(text) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { toast('Filen är inte giltig JSON.', true); return; }
  const res = Store.validate(obj);
  if (!res.clean) { modal({ title: 'Importen avvisades', body: `<ul>${res.errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul>` }); return; }
  const c = res.clean, n = COLLECTIONS.map(k => `${c[k].length} ${k}`).join(', ');
  modal({ title: 'Importera data', body: `<p>Filen innehåller: ${esc(n)}, ${c.favs.length} favoriter.</p>${res.warnings.length ? `<p class="small" style="color:var(--warn)">${res.warnings.length} poster hoppades över (t.ex. ${esc(res.warnings[0])}).</p>` : ''}<p class="small muted"><b>Slå ihop</b> lägger till nya poster och behåller dina befintliga. <b>Ersätt</b> byter ut allt.</p>`,
    actions: [{ label: 'Avbryt' }, { label: 'Ersätt', cls: 'danger', onClick: () => { Store.importData(c, 'replace'); document.documentElement.dataset.theme = Store.pref('theme'); toast('Data importerad'); render(); } }, { label: 'Slå ihop', cls: 'primary', onClick: () => { Store.importData(c, 'merge'); toast('Data importerad'); render(); } }] });
}
function convUpdate() { const o = $('#convOut'); if (o) o.innerHTML = convHTML(); }
function histCSV(coll) {
  const rows = [['Datum', 'Namn', 'Beräkning', 'Projekt', 'Indata', 'Resultat', 'Anteckning', 'Formeltyp', 'Verifieringsstatus', 'Varning']];
  Store.data[coll].forEach(h => { const c = CALC[h.calc], f = c && FORM[c.f]; rows.push([Format.dt(h.t), h.title || h.calc, c ? c.title : h.calc, projName(h.project), (h.ins || []).map(i => `${i.l}: ${i.v}${i.u ? ' ' + i.u : ''}`).join(' | '), (h.results || []).filter(r => !r.alt).map(r => `${r.label} = ${resultLine(r)}`).join(' | '), h.note || '', f ? FTYPES[f.type][0] : '', f ? f.verif : '', isUnverified(h.calc) ? UNVERIFIED_NOTICE : '']); });
  return csvRows(rows);
}
function regCSV(reg) {
  const rows = [reg.fields.map(f => f.label)];
  Store.data[reg.coll].forEach(r => rows.push(reg.fields.map(f => f.type === 'project' ? projName(r[f.id]) : f.type === 'num' ? Format.raw(r[f.id]) : (r[f.id] || '')))); return csvRows(rows);
}
const ACT = {
  back: el => goBack(el.dataset.fallback),
  fav: el => {
    const on = Store.toggleFav(el.dataset.key); toast(on ? 'Tillagd i favoriter' : 'Borttagen från favoriter');
    if ((parseHash().parts[0]) === 'favs') render(); else el.outerHTML = favBtn(el.dataset.key);
  },
  clear: () => { const c = curCalc(); if (c) { delete App.drafts[c.id]; App.last = null; render(); } },
  copyres: () => { const r = lastRecord(); if (!r) return toast('Beräkna först.', true); copyText(recText(r)); },
  saveres: () => saveResultDialog(),
  printres: () => { const r = lastRecord(); if (!r) return toast('Beräkna först.', true); printDoc(reportPrintHTML({ name: '', date: today(), desc: '', notes: '', blocks: [calcBlock(r)], meas: [], regs: [], costs: [], total: 0, kn: [] })); },
  copyformula: el => copyText(FORM[el.dataset.id].name + ': ' + plainExpr(FORM[el.dataset.id].expr)),
  /* historik */
  htab: el => { App.histTab = el.dataset.tab; render(); },
  hdel: el => { Store.remove(el.dataset.coll, el.dataset.id); toast('Posten raderades'); render(); },
  hcopy: el => { const h = Store.get(el.dataset.coll, el.dataset.id); if (h) copyText(recText(h)); },
  hclear: () => confirmBox('Rensa?', App.histTab === 'history' ? 'Hela historiken raderas. Sparade resultat påverkas inte.' : 'Alla sparade resultat raderas.', 'Rensa', () => { Store.clear(App.histTab); toast('Rensat'); render(); }),
  hexport: () => download(`bergpro-${App.histTab}-${today()}.csv`, histCSV(App.histTab), 'text/csv'),
  /* register */
  regedit: el => { App.regEdit = { reg: el.dataset.reg, id: el.dataset.id }; regRefresh(el.dataset.reg); const f = $('#regForm'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  regcancel: () => { const k = App.regEdit && App.regEdit.reg; App.regEdit = null; if (k) regRefresh(k); },
  regreset: () => { const f = $('#regForm'); if (f) regRefresh(f.dataset.reg); },
  regdel: el => confirmBox('Radera posten?', 'Posten tas bort permanent.', 'Radera', () => { Store.remove(REGS[el.dataset.reg].coll, el.dataset.id); if (App.regEdit && App.regEdit.id === el.dataset.id) App.regEdit = null; regRefresh(el.dataset.reg); toast('Posten raderades'); }),
  regclear: el => confirmBox('Radera alla poster?', `Alla poster i ”${esc(REGS[el.dataset.reg].title)}” raderas.`, 'Radera alla', () => { Store.clear(REGS[el.dataset.reg].coll); App.regEdit = null; regRefresh(el.dataset.reg); toast('Rensat'); }),
  regexport: el => { const reg = REGS[el.dataset.reg]; download(`bergpro-${reg.key}-${today()}.csv`, regCSV(reg), 'text/csv'); },
  series: el => {
    const [kind, unit, pr, pl, ms, cp, ins] = JSON.parse(el.dataset.k);
    const vals = Store.data.journal.filter(j => j.kind === kind && j.unit === unit && (j.project || '') === pr && (j.place || '') === pl && (j.measure || 'Okänt') === ms && (j.comp || 'Okänd') === cp && (j.instrument || '') === ins).slice().reverse().map(j => Format.raw(j.value));
    App.drafts.series = seriesDraft(kind, unit, vals); go('#/calc/series');
  },
  /* projekt */
  projedit: el => { App.projEdit = el.dataset.id; go('#/projects'); },
  projcancel: () => { App.projEdit = null; render(); },
  projdel: el => confirmBox('Radera projektet?', 'Projektet och dess kostnader raderas. Sparade resultat och mätningar behålls men kopplas bort.', 'Radera', () => {
    const id = el.dataset.id; Store.remove('projects', id);
    ['saved', 'journal', 'fractures', 'rocknotes', 'sources', 'risknotes', 'assumptions', 'reviewnotes'].forEach(k => Store.data[k].forEach(r => { if (r.project === id) r.project = ''; })); Store.save(); toast('Projektet raderades'); go('#/projects');
  }),
  unlink: el => { Store.update('saved', el.dataset.id, { project: '' }); render(); },
  costdel: el => { const p = Store.get('projects', el.dataset.pid); if (p) { p.costs = (p.costs || []).filter(c => c.id !== el.dataset.id); Store.save(); render(); } },
  rep: el => {
    const p = Store.get('projects', el.dataset.id); if (!p) return;
    const m = projectModel(p), base = 'bergpro-' + slug(p.name) + '-' + today();
    if (el.dataset.fmt === 'txt') download(base + '.txt', reportTXT(m), 'text/plain');
    else if (el.dataset.fmt === 'csv') download(base + '.csv', reportCSV(m), 'text/csv');
    else if (el.dataset.fmt === 'json') download(base + '.json', JSON.stringify({ app: 'BergPro', type: 'project', version: 1, project: p, notice: 'Poster med unverified = true kommer från en EJ VERIFIERAD egen modell: ' + UNVERIFIED_NOTICE, linked: { saved: projLinked(p).saved.map(s => { const c = CALC[s.calc], f = c && FORM[c.f]; return Object.assign({}, s, { unverified: isUnverified(s.calc), formulaType: f ? FTYPES[f.type][0] : '', verification: f ? f.verif : '', warnings: calcBlock(s).warnings, formulaVersionNow: f ? f.ver : '' }); }), journal: projLinked(p).journal } }, null, 2), 'application/json');
    else printDoc(reportPrintHTML(m));
  },
  /* inställningar */
  exportjson: () => download(`bergpro-export-${today()}.json`, JSON.stringify(Store.exportObj(), null, 2), 'application/json'),
  importpick: () => { const f = $('#importFile'); if (f) f.click(); },
  clearall: () => clearAllData(),
  /* enheter, uttryck, självtest */
  swapconv: () => { const c = App.conv; [c.from, c.to] = [c.to, c.from]; const f = $('#cf'), t = $('#ct'); if (f) f.value = c.from; if (t) t.value = c.to; convUpdate(); },
  copyconv: el => copyText(el.dataset.t),
  qcopy: () => { if (App.quickRes) copyText(`${App.quickRes.e} = ${App.quickRes.r}`); },
  qsave: () => { const q = App.quickRes; if (!q) return; Store.data.quick = Store.data.quick.filter(x => x.e !== q.e); Store.data.quick.unshift({ e: q.e.slice(0, 300), r: q.r }); Store.data.quick.length = Math.min(Store.data.quick.length, 30); Store.save(); toast('Sparat i listan'); render(); },
  qclear: () => { App.quickSrc = ''; App.quickRes = null; render(); const i = $('#qe'); if (i) i.focus(); },
  qreuse: el => { const q = Store.data.quick[+el.dataset.i]; if (q) { App.quickSrc = q.e; render(); } },
  qdel: el => { Store.data.quick.splice(+el.dataset.i, 1); Store.save(); render(); },
  qlistclear: () => confirmBox('Rensa listan?', 'Alla sparade uttryck raderas.', 'Rensa', () => { Store.data.quick = []; Store.save(); render(); }),
  rerunTests: () => { const o = $('#stOut'); if (o) { o.innerHTML = selftestHTML(); toast('Testerna kördes'); } },
};
/* input-händelser (medan användaren skriver) */
const INPUT = {
  search: el => { App.q = el.value; $('#searchRes').innerHTML = searchResultsHTML(App.q); $('#homeSecs').hidden = !!App.q.trim(); },
  catfilter: el => {
    const toks = Util.norm(el.value).split(/\s+/).filter(Boolean); let n = 0;
    $$('#catList li').forEach(li => { const ok = toks.every(t => li.dataset.f.includes(t)); li.hidden = !ok; if (ok) n++; });
    $('#catNone').hidden = n > 0;
  },
  fsearch: () => { App.fq = ($('#fq') || {}).value || ''; App.ff.cat = ($('#fc') || {}).value || ''; App.ff.type = ($('#ft') || {}).value || ''; $('#fList').innerHTML = formulaListHTML(); },
  hsearch: el => { App.histQ = el.value; $('#hList').innerHTML = histListHTML(); },
  regsearch: el => { App.regQ[el.dataset.reg] = el.value; $('#regList').innerHTML = regListHTML(REGS[el.dataset.reg]); },
  conv: () => { App.conv.v = $('#cv').value; convUpdate(); },
};
const CHANGE = {
  fsearch: () => INPUT.fsearch(),
  theme: el => { Store.pref('theme', el.value); document.documentElement.dataset.theme = el.value; },
  sig: el => { const n = parseInt(el.value, 10); Store.pref('sig', n); CFG.sig = n; toast('Gällande siffror: ' + n); },
  gval: el => { Store.pref('g', parseFloat(el.value)); toast('g = ' + el.value.replace('.', ',') + ' m/s²'); },
  qangle: el => { App.angle = el.value; const q = $('#qe'); if (q && q.value.trim()) { App.quickSrc = q.value; $('#quickOut').innerHTML = quickOutHTML(App.quickSrc); } },
  conv: el => {
    const c = App.conv;
    if (el.id === 'cg') { c.g = el.value; const l = UNITS[c.g].list; const b = l.find(u => u[2] === 1) || l[0]; c.from = b[0]; c.to = (l.find(u => u !== b) || b)[0]; render(); return; }
    if (el.id === 'cf') c.from = el.value; if (el.id === 'ct') c.to = el.value;
    convUpdate();
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); try { fn(el, e); } catch (err) { console.error(err); toast('Något gick fel: ' + err.message, true); } }
});
document.addEventListener('input', e => { const el = e.target.closest('[data-act-input]'); if (el && INPUT[el.dataset.actInput]) INPUT[el.dataset.actInput](el); });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'importFile') { const f = el.files && el.files[0]; if (!f) return; if (f.size > 20e6) { toast('Filen är för stor (max 20 MB).', true); return; } const rd = new FileReader(); rd.onload = () => { importDialog(String(rd.result)); el.value = ''; }; rd.onerror = () => toast('Kunde inte läsa filen.', true); rd.readAsText(f); return; }
  const a = el.closest('[data-act-change]'); if (a && CHANGE[a.dataset.actChange]) { CHANGE[a.dataset.actChange](a); return; }
  /* kalkylator: byte av val som styr enhetsgrupp (t.ex. radie/diameter, storhet) */
  const c = curCalc();
  const fin = c && el.dataset.in && c.inputs.find(i => i.id === el.dataset.in && i.fills);
  if (fin) { const val = fin.fills.values[el.value], t = $('#in-' + fin.fills.target); if (t && val !== undefined) { t.value = String(val).replace('.', ','); t.dispatchEvent(new Event('input', { bubbles: true })); } }
  if (c && el.dataset.in && c.inputs.some(i => i.unitDyn && i.unitDyn.dep === el.dataset.in)) {
    const d = readForm(c); App.drafts[c.id] = d;
    $('#calcForm .form').innerHTML = c.inputs.map(i => fieldHTML(c, i, d)).join('');
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'q') { const r = Search.query(e.target.value, 1)[0]; if (r) { e.preventDefault(); if ((r.kind === 'calc' && isUnverified(r.id)) || (r.kind === 'formula' && FORM[r.id] && FORM[r.id].type === 'unverified')) { toast('Första träffen är en ej verifierad egen modell – välj i listan.'); return; } go(r.href); } }
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'calcForm') return calcSubmit(CALC[f.dataset.calc]);
  if (f.id === 'quickForm') { App.quickSrc = $('#qe').value; $('#quickOut').innerHTML = quickOutHTML(App.quickSrc); return; }
  if (f.id === 'regForm') {
    const reg = REGS[f.dataset.reg], { rec, errors } = readFields(reg.fields, 'r-');
    if (!showFieldErrors(reg.fields, errors, 'r-')) return;
    if (App.regEdit) Store.update(reg.coll, App.regEdit.id, rec); else Store.add(reg.coll, rec);
    App.regEdit = null; regRefresh(reg.key); toast(Store.ok ? 'Sparat' : 'Sparat tillfälligt (lagring ej tillgänglig)'); return;
  }
  if (f.id === 'scanForm') {
    const key = $('#scanKey').value, v = $('#scan').value.trim(), w = $('#w-scan'), m = $('#m-scan'); w.classList.remove('bad'); m.textContent = '';
    const lens = Object.assign({}, Store.pref('scanlines') || {});
    if (v === '') { delete lens[key]; Store.pref('scanlines', lens); return regRefresh('fractures'); }
    const r = Parse.num(v); const err = r.error || (!(r.value > 0) ? 'Måste vara större än 0.' : '');
    if (err) { w.classList.add('bad'); m.textContent = err; return; }
    lens[key] = r.value; Store.pref('scanlines', lens); regRefresh('fractures'); return;
  }
  if (f.id === 'projForm') {
    const { rec, errors } = readFields(PROJ_FIELDS, 'p-'); if (!showFieldErrors(PROJ_FIELDS, errors, 'p-')) return;
    if (App.projEdit) { Store.update('projects', App.projEdit, rec); const p = Store.get('projects', App.projEdit); ['drillm', 'vol'].forEach(k => { if (rec[k] === undefined) delete p[k]; }); Store.save(); const id = App.projEdit; App.projEdit = null; toast('Projektet uppdaterades'); go('#/project/' + id); }
    else { const p = Store.add('projects', Object.assign(rec, { costs: [] })); toast('Projektet skapades'); go('#/project/' + p.id); }
    return;
  }
  if (f.id === 'costForm') {
    const { rec, errors } = readFields(COST_F, 'c-'); if (!showFieldErrors(COST_F, errors, 'c-')) return;
    const p = Store.get('projects', f.dataset.id); if (!p) return;
    p.costs = p.costs || []; p.costs.push({ id: Util.uid(), label: rec.label, amount: rec.amount }); Store.save(); render(); return;
  }
  if (f.id === 'linkForm') { Store.update('saved', $('#linksel').value, { project: f.dataset.id }); render(); }
});

/* ---------- Start ---------- */
function updateOnline() { const t = $('#offlineTxt'), pill = $('#offlinePill'); if (!t) return; const on = navigator.onLine !== false; t.textContent = on ? 'Offline-klar' : 'Offline'; pill.title = on ? 'Appen är en enda fil och behöver inget internet' : 'Ingen uppkoppling – allt fungerar ändå'; }
function startApp() {
  Store.onError = m => toast(m, true);
  Store.init();
  /* Ägarens önskemål: den egna modellen stjärnmärkt vid allra första start – återställs inte efter rensning/import. */
  if (Store.firstRun) { Store.data.favs.unshift('c:blast_model'); Store.save(); }
  document.documentElement.dataset.theme = Store.pref('theme') === 'light' ? 'light' : 'dark';
  if (!Store.ok) { const w = $('#storeWarn'); w.hidden = false; w.innerHTML = ic('alert') + '<span>Lokal lagring är inte tillgänglig i den här miljön (t.ex. privat läge). Data sparas bara tills sidan stängs – exportera till JSON under Inställningar för att behålla dem.</span>'; }
  window.addEventListener('hashchange', render);
  try { if (Store.ok && navigator.storage && navigator.storage.persist) navigator.storage.persist().then(v => { App.persisted = v; }, () => { }); } catch (e) { /* stöds inte */ }
  window.addEventListener('online', updateOnline); window.addEventListener('offline', updateOnline); updateOnline();
  render();
  /* Bygg sökindexet när appen är ledig så att första sökningen går snabbt även på långsamma telefoner. */
  setTimeout(() => { try { if (!Search.items) Search.build(); } catch (e) { /* byggs vid första sökning */ } }, 50);
}
startApp();
