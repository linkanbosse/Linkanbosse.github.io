name: Nalle Blaster – betalserver

# Laddar upp betalservern till Cloudflare och sparar dess adress i spelet (nalle-blaster/config.js).
# Kräver tre hemligheter i repot (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, STRIPE_SECRET_KEY
# Saknas någon hoppar jobbet över uppladdningen och skriver en varning i stället.

on:
  push:
    branches: [main, master]
    paths:
      - 'nalle-blaster-betalning/**'
      - '.github/workflows/nalle-blaster-betalning.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nalle-blaster-betalning
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Kolla att nycklarna finns
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          missing=""
          [ -z "$CF_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$STRIPE_KEY" ] && missing="$missing STRIPE_SECRET_KEY"
          if [ -n "$missing" ]; then
            echo "::warning::Betalservern laddades inte upp. Saknade hemligheter:$missing. Se nalle-blaster-betalning/README.md"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ladda upp till Cloudflare
        id: deploy
        if: steps.check.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: nalle-blaster-betalning
          secrets: |
            STRIPE_SECRET_KEY
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      - name: Spara serverns adress i spelet
        if: steps.check.outputs.ok == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::Cloudflare gav ingen adress. Öppna Workers & Pages i Cloudflare en gång och välj ett workers.dev-namn, kör sedan jobbet igen."
            exit 1
          fi
          echo "window.NB_PAY_URL = \"${URL%/}\";" > nalle-blaster/config.js
          if git diff --quiet; then
            echo "Adressen var redan sparad."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Nalle Blaster: spara betalserverns adress"
          # Sidan publiceras från master, så samma commit skickas till båda grenarna.
          git push origin HEAD:main HEAD:master
          # Pushar från GITHUB_TOKEN startar inte andra jobb, så sidan publiceras om manuellt här.
          gh workflow run deploy.yml --ref master
