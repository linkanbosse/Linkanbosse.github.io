<!DOCTYPE html>
<html lang="sv" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<meta name="color-scheme" content="dark light">
<title>BergPro – tekniskt beräkningsverktyg</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%229%22%20fill%3D%22%23101820%22%2F%3E%3Cpath%20d%3D%22M5%2031%2016%2011l5%209%204-5%2010%2016z%22%20fill%3D%22none%22%20stroke%3D%22%23d6f36a%22%20stroke-width%3D%222.6%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<style>
/* ===== BergPro – stilmall ===== */
:root{
  --bg:#101820; --bg2:#0c1218; --panel:#1b2732; --panel2:#223140; --line:#2f4254;
  --text:#f5f7fa; --muted:#aab7c4; --accent:#d6f36a; --accent-ink:#17210a;
  --err:#ff6b6b; --err-bg:rgba(255,107,107,.12);
  --warn:#ffd34d; --warn-bg:rgba(255,211,77,.12);
  --ok:#6fcf97; --ok-bg:rgba(111,207,151,.12);
  --shadow:0 6px 24px rgba(0,0,0,.28);
  --r:16px; --r-sm:10px; --gap:16px; --tap:48px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --nav-h:64px; --side-w:248px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eef2f5; --bg2:#e2e8ee; --panel:#ffffff; --panel2:#f3f6f9; --line:#cfd8e0;
  --text:#101820; --muted:#4a5a69; --accent:#4c7a00; --accent-ink:#ffffff;
  --err:#c62828; --err-bg:rgba(198,40,40,.08);
  --warn:#8a5a00; --warn-bg:rgba(240,170,0,.16);
  --ok:#1f7a43; --ok-bg:rgba(31,122,67,.1);
  --shadow:0 6px 20px rgba(16,24,32,.1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--font);overflow-x:hidden;min-height:100vh}
h1,h2,h3{line-height:1.2;margin:0}
h1{font-size:1.6rem;letter-spacing:-.01em}
h2{font-size:1.15rem}
h3{font-size:1rem}
p{margin:.4em 0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.fill{fill:currentColor;stroke:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:8px;z-index:200}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ----- Skal ----- */
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
.side{display:none}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem;letter-spacing:.01em;color:var(--text);text-decoration:none}
.brand:hover{text-decoration:none}
.brand .logo{width:34px;height:34px;color:var(--accent)}
.brand b{color:var(--accent)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.pill.off i{background:var(--warn)}
.icon-btn{display:inline-grid;place-items:center;min-width:var(--tap);height:var(--tap);border-radius:12px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--text)}
.icon-btn:hover{background:var(--panel)}
.content{width:100%;max-width:1100px;margin:0 auto;padding:18px 16px calc(var(--nav-h) + 40px)}
.view{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);height:var(--nav-h);padding-bottom:env(safe-area-inset-bottom,0)}
.bottom a,.side a.nav{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:.72rem;text-decoration:none;min-height:var(--nav-h)}
.bottom a[aria-current="page"]{color:var(--accent)}
.bottom a[aria-current="page"] svg{transform:translateY(-1px)}
.warnbar{background:var(--warn-bg);border-bottom:1px solid var(--warn);color:var(--warn);font-size:.85rem;padding:8px 16px;display:flex;gap:8px;align-items:flex-start}
.warnbar[hidden]{display:none}
@media(min-width:900px){
  .app{grid-template-columns:var(--side-w) 1fr}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:16px 12px;background:var(--bg2);border-right:1px solid var(--line);overflow:auto}
  .side .brand{padding:6px 10px 18px}
  .side a.nav{flex-direction:row;justify-content:flex-start;gap:12px;font-size:1rem;padding:0 14px;min-height:46px;border-radius:12px}
  .side a.nav:hover{background:var(--panel);text-decoration:none}
  .side a.nav[aria-current="page"]{background:var(--panel);color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
  .side .grp{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 14px 4px}
  .bottom{display:none}
  .content{padding-bottom:60px}
  .top .brand{display:none}
}

/* ----- Komponenter ----- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card + .card,.card + .grid,.grid + .card{margin-top:var(--gap)}
.stack>*+*{margin-top:var(--gap)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.mono{font-family:var(--mono)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.sec{margin-top:26px}
.sec>h2{margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.pagehead{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.pagehead h1{flex:1;min-width:0;overflow-wrap:anywhere}
.crumb{color:var(--muted);font-size:.85rem;margin-bottom:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font-weight:600;text-decoration:none;transition:transform .08s,background .15s}
.btn:hover{background:var(--line);text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.ghost{background:transparent}
.btn.sm{min-height:40px;padding:0 12px;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.on svg{fill:var(--accent);stroke:var(--accent)}
.searchbox{position:relative}
.searchbox input{width:100%;height:58px;border-radius:16px;border:1px solid var(--line);background:var(--panel);padding:0 16px 0 52px;font-size:1.1rem}
.searchbox svg{position:absolute;left:16px;top:18px;color:var(--muted)}
.searchbox label{display:block;font-weight:700;margin-bottom:8px;font-size:1.05rem}
.searchbox input:focus{border-color:var(--accent)}
.searchbox .clear{position:absolute;right:6px;bottom:5px}
.tile{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);color:var(--text);text-decoration:none;min-height:96px;cursor:pointer;transition:border-color .15s,transform .1s;text-align:left}
.tile:hover{border-color:var(--accent);text-decoration:none;transform:translateY(-1px)}
.tile .ic{color:var(--accent)}
.tile b{font-size:1rem;line-height:1.2}
.tile span{color:var(--muted);font-size:.82rem;line-height:1.3}
.tile.quick{min-height:84px;background:var(--panel2)}
.tile.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);text-decoration:none;min-height:56px}
a.item:hover{border-color:var(--accent);text-decoration:none}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:650;overflow-wrap:anywhere}
.item .s{color:var(--muted);font-size:.84rem;overflow-wrap:anywhere}
.item .ic{color:var(--accent)}
.badge{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.badge.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.badge.err{color:var(--err);border-color:var(--err);background:var(--err-bg)}
.badge.acc{color:var(--accent);border-color:var(--accent)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty svg{width:36px;height:36px;color:var(--accent);margin-bottom:6px}
.empty b{display:block;color:var(--text);margin-bottom:4px}
.note{border-radius:12px;padding:10px 12px;border:1px solid var(--line);font-size:.9rem;display:flex;gap:10px;align-items:flex-start;background:var(--panel2)}
.note.err{border-color:var(--err);background:var(--err-bg);color:var(--err)}
.note.warn{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.note.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.note.info{color:var(--muted)}
.note svg{margin-top:2px;width:20px;height:20px}
.note>div{min-width:0;overflow-wrap:anywhere}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{min-height:42px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

/* ----- Formulär ----- */
.form{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:640px){.form.two{grid-template-columns:1fr 1fr}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:650;font-size:.95rem}
.field label .u{color:var(--muted);font-weight:400}
.field .hint{color:var(--muted);font-size:.8rem}
.field .msg{color:var(--err);font-size:.85rem;min-height:0}
.ctl{display:flex;gap:8px;min-width:0}
input[type=text],input[type=number],input[type=search],input[type=datetime-local],input[type=date],select,textarea{width:100%;min-height:var(--tap);border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;min-width:0}
:root[data-theme="light"] input[type=text],:root[data-theme="light"] select,:root[data-theme="light"] textarea,:root[data-theme="light"] input[type=datetime-local]{background:#fff}
textarea{min-height:120px;resize:vertical;font-family:var(--mono);font-size:.95rem}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.field.bad input,.field.bad textarea,.field.bad select{border-color:var(--err);background:var(--err-bg)}
.field.good input,.field.good textarea{border-color:var(--ok)}
.ctl select{width:auto;max-width:45%;flex:none}
.ctl input{flex:1}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.actions .btn.primary{flex:1 1 160px}
.check{display:flex;align-items:center;gap:10px;min-height:var(--tap)}
.check input{width:22px;height:22px;accent-color:var(--accent)}

/* ----- Resultat ----- */
.result{border:1px solid var(--accent);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 10%,var(--panel)),var(--panel));border-radius:var(--r);padding:16px}
.result .lbl{color:var(--muted);font-size:.85rem}
.result .big{font-size:2.1rem;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere;line-height:1.15;color:var(--accent)}
.result .big small{font-size:1.1rem;color:var(--text);font-weight:600;margin-left:6px}
.result .alt{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:8px 0 0;margin-top:8px;overflow-wrap:anywhere}
.result .alt b{white-space:nowrap}
.steps{margin:0;padding-left:1.2em;color:var(--muted);font-family:var(--mono);font-size:.88rem}
.steps li{margin:4px 0;overflow-wrap:anywhere}
.formula{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:1.25rem;font-family:"Cambria Math","STIX Two Math",Cambria,"Times New Roman",serif;overflow-x:auto;line-height:2}
.formula .frac,.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .2em;line-height:1.25}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .3em}
.frac>span:last-child{padding:0 .3em}
.rt{border-top:1.5px solid currentColor;padding:0 .15em}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.tbl th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.kv{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:6px 14px;font-size:.92rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.chart{width:100%;height:auto;display:block;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .ln{stroke:var(--accent);fill:none;stroke-width:2}
.chart .mean{stroke:var(--warn);stroke-dasharray:5 4;fill:none;stroke-width:1.5}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .pt{fill:var(--accent)}
details.card>summary{cursor:pointer;font-weight:700;min-height:32px;display:flex;align-items:center}
details.card[open]>summary{margin-bottom:10px}

/* ----- Dialog / toast ----- */
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--text);padding:0;max-width:min(520px,calc(100vw - 24px));width:100%;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog .dh{padding:16px 16px 0;font-weight:800;font-size:1.1rem}
dialog .db{padding:12px 16px;max-height:65vh;overflow:auto}
dialog .df{padding:0 16px 16px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 14px);transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100vw - 24px);max-width:420px}
.toast{background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:99px;font-weight:650;box-shadow:var(--shadow);animation:fade .15s}
.toast.err{background:var(--err);color:#fff}
@media(min-width:900px){#toast{bottom:20px}}

/* ----- Utskrift ----- */
#printRoot{display:none}
@media print{
  body.printing>*:not(#printRoot){display:none!important}
  body.printing #printRoot{display:block!important;color:#000;background:#fff;font:11pt/1.4 Georgia,"Times New Roman",serif;padding:0}
  #printRoot h1{font-size:20pt;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:4px}
  #printRoot h2{font-size:13pt;margin:16px 0 6px;border-bottom:1px solid #888}
  #printRoot .meta{color:#333;font-size:10pt;margin-bottom:10px}
  #printRoot table{width:100%;border-collapse:collapse;margin:6px 0;font-size:10pt}
  #printRoot th,#printRoot td{border:1px solid #888;padding:4px 6px;text-align:left;vertical-align:top}
  #printRoot .block{break-inside:avoid;margin-bottom:12px}
  #printRoot .formula{border:1px solid #888;background:#fff;color:#000;font-size:13pt}
  #printRoot .frac>span:first-child{border-color:#000}
  #printRoot .foot{margin-top:18px;font-size:9pt;color:#444;border-top:1px solid #888;padding-top:6px}
  @page{margin:16mm}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ----- Tillägg ----- */
.item a.grow{color:inherit;text-decoration:none;min-width:0}
.item a.grow:hover{text-decoration:none}
.item .icon-btn{min-width:44px;height:44px}
.icon-btn.on{color:var(--accent)}
.sec>h2 .row{gap:6px}
.tabs{padding-bottom:2px}
.field.bad .msg:empty{display:none}
img,svg,video{max-width:100%}

.searchbox .sbw{position:relative}
.searchbox .sbw input{padding:0 16px 0 52px}

/* ----- Tryckytor för pekskärm (≥ 44 px) ----- */
.top .brand{min-height:44px}
.sec>h2 a.small{display:inline-flex;align-items:center;min-height:44px;padding:0 10px;margin:-10px -10px -10px 0}
summary{min-height:44px;display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:0;height:0;border-left:6px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent;transition:transform .15s;flex:none}
details[open]>summary::before{transform:rotate(90deg)}
details.card>summary{min-height:44px}
.btn.sm{min-height:44px}
.top{background:var(--bg);backdrop-filter:none}
h1[tabindex="-1"]:focus{outline:none}

/* ----- Ej verifierad modell (säkerhetsgranskning M5) ----- */
.result.unv{border-color:var(--err);background:linear-gradient(180deg,var(--err-bg),var(--panel))}
.result.unv .big{color:var(--text)}
.unvtag{display:flex;align-items:center;gap:8px;color:var(--err);font-weight:800;letter-spacing:.04em;font-size:.85rem;margin-bottom:8px}
.unvtag svg{width:18px;height:18px}
.ctl .unit{display:inline-flex;align-items:center;padding:0 12px;min-height:var(--tap);border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);white-space:nowrap;flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.formula i{font-style:italic}

@media print{
  body.printing #printRoot .unvbox{border:2px solid #000;padding:6px 8px;margin:6px 0;font-weight:bold;font-size:11pt}
  body.printing #printRoot .warns{margin:6px 0;padding-left:18px;font-size:10.5pt}
}

/* Smal skärm: långa etiketter får radbrytas (säkerhetsgranskning N6) */
.kv{grid-template-columns:minmax(90px,max-content) minmax(0,1fr)}
.kv .badge,.item .badge{white-space:normal;max-width:100%}
@media(max-width:380px){.kv{grid-template-columns:minmax(0,1fr)}.kv dd{margin-bottom:6px}}

</style>
</head>

<!-- Ikon-sprite (inline SVG, inga externa filer) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-logo" viewBox="0 0 40 40"><path d="M3 33 15 10l6 10 4-6 12 19z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M15 10l-3 6 5 3-3 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="31" cy="9" r="3" fill="currentColor"/></symbol>

<script>
/* ============================================================
   BergPro – KÄRNA (ren logik utan DOM-beroenden)
   Moduler: Util · Parse · Format · Units · Expr · Notation · Charts · Store
   ============================================================ */
'use strict';

/* ---------- Util ---------- */
class CalcError extends Error {
  constructor(msg, field) { super(msg); this.field = field || null; }
}
const Util = {
  esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },
  uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); },
  /* Normalisera för sökning: gemener, utan diakritiska tecken (å→a, ä→a, ö→o) */
  norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); },
  sum(a) { let s = 0, c = 0; for (const x of a) { const y = x - c, t = s + y; c = (t - s) - y; s = t; } return s; }, // Kahan
};

/* ---------- Parse: svensk decimalinmatning ---------- */
const Parse = {
  /** Tolkar ett tal. Returnerar {empty}|{error}|{value}. Accepterar 1 234,5 · 1,2e-3 · −5 */
  num(raw) {
    if (raw == null) return { empty: true };
    let s = String(raw).trim().replace(/−/g, '-').replace(/[\s   ]/g, '');
    if (s === '') return { empty: true };
    if (s.includes(',') && s.includes('.')) return { error: 'Oklart decimaltecken – använd antingen komma eller punkt.' };
    s = s.replace(',', '.');
    if (!/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(s)) return { error: 'Ogiltigt tal. Skriv t.ex. 12,5 eller 1,2e-3.' };
    const digits = s.replace(/[eE].*$/, '').replace(/[^0-9]/g, '').replace(/^0+/, '').replace(/0+$/, ''); /* gällande siffror */
    if (digits.length > 17) return { error: 'För många siffror – högst 17 gällande siffror kan lagras.' };
    const v = Number(s);
    if (!Number.isFinite(v)) return { error: 'Talet är för stort.' };
    return { value: v };
  },
  /** Lista av tal separerade med blanksteg, radbrytning, tab eller semikolon. */
  list(raw) {
    const toks = String(raw == null ? '' : raw).split(/[\s;]+/).filter(Boolean);
    const values = [], errors = [];
    toks.forEach((t, i) => {
      const r = Parse.num(t);
      if (r.error || r.empty) errors.push(`Värde ${i + 1} ("${t}"): ${r.error || 'tomt'}`);
      else values.push(r.value);
    });
    return { values, errors };
  },
  /** Rader med två tal (t.ex. station och area). */
  pairs(raw) {
    const lines = String(raw == null ? '' : raw).split(/\r?\n/);
    const rows = [], errors = [];
    lines.forEach((ln, i) => {
      if (!ln.trim()) return;
      const t = ln.trim().split(/[;\t ]+/).filter(Boolean);
      if (t.length !== 2) { errors.push(`Rad ${i + 1}: ange exakt två tal (fick ${t.length}).`); return; }
      const a = Parse.num(t[0]), b = Parse.num(t[1]);
      if (a.error || b.error) errors.push(`Rad ${i + 1}: ${a.error || b.error}`);
      else rows.push([a.value, b.value]);
    });
    return { rows, errors };
  },
};

/* ---------- Format: avrunda endast för presentation ---------- */
const CFG = { sig: 6 };
const SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
const Format = {
  group(ip) { return ip.replace(/\B(?=(\d{3})+(?!\d))/g, ' '); },
  /** Presentationsformat med svensk decimal (komma) och tusentalsavgränsare (hårt mellanrum). */
  num(x, sig) {
    sig = sig || CFG.sig;
    if (x === null || x === undefined || typeof x !== 'number' || !Number.isFinite(x)) return '–';
    if (x === 0) return '0';
    const a = Math.abs(x);
    if (a >= 1e9 || a < 1e-4) {
      const [m, e] = x.toExponential(sig - 1).split('e');
      const mant = (m.includes('.') ? m.replace(/0+$/, '').replace(/\.$/, '') : m).replace('.', ',');
      const mantS = mant.replace(/^-/, '−');
      return mantS + '·10' + String(parseInt(e, 10)).split('').map(c => SUP[c]).join('');
    }
    const p = Number(x.toPrecision(sig));
    const neg = p < 0;
    const [ip, fp] = Math.abs(p).toString().split('.');
    return (neg ? '−' : '') + (ip.length > 3 ? Format.group(ip) : ip) + (fp ? ',' + fp : '');
  },
  /** Fullprecision i text (för export/kopiering av råvärde) med decimalkomma. */
  raw(x) { return Number.isFinite(x) ? String(Number(x.toPrecision(12))).replace('.', ',') : ''; },
  dt(ts) {
    const d = new Date(ts);
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  },
  date(ts) { return Format.dt(ts).slice(0, 10); },
};

/* ---------- Units: omräkningsfaktorer till SI-bas ---------- */
const UNITS = {
  length: { label: 'Längd', base: 'm', list: [['mm', 'mm', 1e-3], ['cm', 'cm', 1e-2], ['m', 'm', 1], ['km', 'km', 1e3], ['in', 'tum (in)', 0.0254], ['ft', 'fot (ft)', 0.3048], ['yd', 'yard (yd)', 0.9144], ['mi', 'mile (mi)', 1609.344]] },
  area: { label: 'Area', base: 'm²', list: [['mm2', 'mm²', 1e-6], ['cm2', 'cm²', 1e-4], ['m2', 'm²', 1], ['ha', 'hektar (ha)', 1e4], ['km2', 'km²', 1e6], ['in2', 'in²', 6.4516e-4], ['ft2', 'ft²', 0.09290304], ['yd2', 'yd²', 0.83612736], ['acre', 'acre', 4046.8564224]] },
  volume: { label: 'Volym', base: 'm³', list: [['mm3', 'mm³', 1e-9], ['cm3', 'cm³', 1e-6], ['ml', 'mL', 1e-6], ['l', 'liter (L)', 1e-3], ['m3', 'm³', 1], ['in3', 'in³', 1.6387064e-5], ['ft3', 'ft³', 0.028316846592], ['yd3', 'yd³', 0.764554857984], ['galus', 'US gallon', 0.003785411784], ['galuk', 'brittisk gallon', 0.00454609]] },
  mass: { label: 'Massa', base: 'kg', list: [['mg', 'mg', 1e-6], ['g', 'g', 1e-3], ['kg', 'kg', 1], ['t', 'ton (t)', 1000], ['lb', 'pound (lb)', 0.45359237], ['oz', 'ounce (oz)', 0.028349523125], ['ston', 'short ton (US)', 907.18474], ['lton', 'long ton (UK)', 1016.0469088]] },
  density: { label: 'Densitet', base: 'kg/m³', list: [['kgm3', 'kg/m³', 1], ['gcm3', 'g/cm³', 1000], ['tm3', 't/m³', 1000], ['kgl', 'kg/L', 1000], ['lbft3', 'lb/ft³', 16.018463373960138], ['lbin3', 'lb/in³', 27679.904710203125]] },
  pressure: { label: 'Tryck och spänning', base: 'Pa', list: [['pa', 'Pa', 1], ['kpa', 'kPa (kN/m²)', 1e3], ['mpa', 'MPa (N/mm²)', 1e6], ['gpa', 'GPa', 1e9], ['bar', 'bar', 1e5], ['atm', 'atm', 101325], ['psi', 'psi (lbf/in²)', 6894.757293168361], ['ksi', 'ksi', 6894757.293168361], ['kgfcm2', 'kgf/cm² (kraft)', 98066.5], ['mmhg', 'mmHg', 133.322387415]] },
  speed: { label: 'Hastighet', base: 'm/s', list: [['mms', 'mm/s', 1e-3], ['cms', 'cm/s', 1e-2], ['ms', 'm/s', 1], ['kmh', 'km/h', 1 / 3.6], ['ins', 'in/s', 0.0254], ['fts', 'ft/s', 0.3048], ['mph', 'mph', 0.44704], ['kn', 'knop', 1852 / 3600]] },
  time: { label: 'Tid', base: 's', list: [['us', 'µs', 1e-6], ['msec', 'ms', 1e-3], ['s', 's', 1], ['min', 'min', 60], ['h', 'h', 3600], ['d', 'dygn', 86400], ['wk', 'vecka', 604800]] },
  power: { label: 'Effekt', base: 'W', list: [['w', 'W', 1], ['kw', 'kW', 1e3], ['mw', 'MW', 1e6], ['hk', 'hk (metrisk)', 735.49875], ['hp', 'hp (mekanisk)', 745.69987158227022], ['btuh', 'Btu/h', 0.29307107017222], ['kcalh', 'kcal/h (termokemisk)', 4184 / 3600]] },
  energy: { label: 'Energi', base: 'J', list: [['j', 'J', 1], ['kj', 'kJ', 1e3], ['mj', 'MJ', 1e6], ['wh', 'Wh', 3600], ['kwh', 'kWh', 3.6e6], ['cal', 'cal (termokemisk)', 4.184], ['kcal', 'kcal (termokemisk)', 4184], ['btu', 'Btu (IT)', 1055.05585262], ['ftlbf', 'ft·lbf', 1.3558179483314004]] },
  force: { label: 'Kraft', base: 'N', list: [['n', 'N', 1], ['kn_', 'kN', 1e3], ['mn', 'MN', 1e6], ['kgf', 'kgf', 9.80665], ['lbf', 'lbf', 4.4482216152605], ['tf', 'tf (tonkraft)', 9806.65]] },
  accel: { label: 'Acceleration', base: 'm/s²', list: [['ms2', 'm/s²', 1], ['mms2', 'mm/s²', 1e-3], ['g', 'g (9,80665 m/s²)', 9.80665], ['fts2', 'ft/s²', 0.3048]] },
  angle: { label: 'Vinkel', base: 'rad', list: [['deg', '°', Math.PI / 180], ['rad', 'rad', 1], ['gon', 'gon', Math.PI / 200]] },
  freq: { label: 'Frekvens', base: 'Hz', list: [['hz', 'Hz', 1], ['khz', 'kHz', 1e3], ['rpm', 'varv/min', 1 / 60]] },
  strain: { label: 'Töjning', base: '–', list: [['one', '– (utan enhet)', 1], ['pct', '%', 0.01], ['ue', 'µε (mikrostrain)', 1e-6]] },
};
const Units = {
  def(group, key) { const g = UNITS[group]; if (!g) throw new Error('Okänd enhetsgrupp ' + group); const u = g.list.find(x => x[0] === key); if (!u) throw new Error('Okänd enhet ' + key); return u; },
  factor(group, key) { return Units.def(group, key)[2]; },
  label(group, key) { return Units.def(group, key)[1]; },
  toBase(group, key, v) { return v * Units.factor(group, key); },
  fromBase(group, key, v) { return v / Units.factor(group, key); },
  convert(group, v, from, to) { return v * Units.factor(group, from) / Units.factor(group, to); },
  firstKey(group) { return UNITS[group].list[0][0]; },
};

/* ---------- Expr: säker tolkare för matematiska uttryck (ingen eval) ---------- */
const Expr = {
  FUNCS: {
    sqrt: [1, x => { if (x < 0) throw new CalcError('Roten ur ett negativt tal är inte definierat.'); return Math.sqrt(x); }],
    abs: [1, Math.abs], exp: [1, Math.exp],
    ln: [1, x => { if (x <= 0) throw new CalcError('ln kräver ett positivt tal.'); return Math.log(x); }],
    log: [1, x => { if (x <= 0) throw new CalcError('log kräver ett positivt tal.'); return Math.log10(x); }],
    log2: [1, x => { if (x <= 0) throw new CalcError('log2 kräver ett positivt tal.'); return Math.log2(x); }],
    sin: [1, null], cos: [1, null], tan: [1, null], asin: [1, null], acos: [1, null], atan: [1, null],
    min: [-1, Math.min], max: [-1, Math.max], pow: [2, Math.pow],
    round: [1, x => Math.sign(x) * Math.round(Math.abs(x))], floor: [1, Math.floor], ceil: [1, Math.ceil],
  },
  tokenize(src) {
    const s = src.replace(/−/g, '-').replace(/×|·/g, '*').replace(/÷/g, '/').replace(/π/g, 'pi');
    const toks = []; let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (/\s/.test(c)) { i++; continue; }
      let m;
      if ((m = /^(\d+([.,]\d+)?|[.,]\d+)([eE][+-]?\d+)?/.exec(s.slice(i)))) { toks.push({ t: 'n', v: Number(m[0].replace(',', '.')) }); i += m[0].length; continue; }
      if ((m = /^[A-Za-z_][A-Za-z_0-9]*/.exec(s.slice(i)))) { toks.push({ t: 'id', v: m[0].toLowerCase() }); i += m[0].length; continue; }
      if ('+-*/^();'.includes(c)) { toks.push({ t: c }); i++; continue; }
      throw new CalcError(`Oväntat tecken "${c}" på position ${i + 1}.`);
    }
    return toks;
  },
  /** Utvärderar uttryck. opts.angle: 'rad' | 'deg'. Argument i funktioner separeras med semikolon. */
  eval(src, opts) {
    opts = opts || {};
    const deg = opts.angle === 'deg';
    if (String(src || '').length > 500) throw new CalcError('Uttrycket är för långt (högst 500 tecken).');
    const toks = Expr.tokenize(String(src || ''));
    let depth = 0;
    const enter = () => { if (++depth > 60) throw new CalcError('Uttrycket är för djupt nästlat (högst 60 nivåer).'); };
    if (!toks.length) throw new CalcError('Skriv ett uttryck, t.ex. 2*(3+4)^2');
    let p = 0;
    const peek = () => toks[p] && toks[p].t;
    const eat = t => { if (peek() !== t) throw new CalcError(`Förväntade "${t}".`); return toks[p++]; };
    function expr() {
      let v = term();
      while (peek() === '+' || peek() === '-') { const o = toks[p++].t; const r = term(); v = o === '+' ? v + r : v - r; }
      return v;
    }
    function term() {
      let v = unary();
      while (peek() === '*' || peek() === '/') {
        const o = toks[p++].t; const r = unary();
        if (o === '/') { if (r === 0) throw new CalcError('Division med noll.'); v = v / r; } else v = v * r;
      }
      return v;
    }
    function unary() {
      enter();
      try {
        if (peek() === '-') { p++; return -unary(); }
        if (peek() === '+') { p++; return unary(); }
        return power();
      } finally { depth--; }
    }
    function power() {
      const b = primary();
      if (peek() === '^') { p++; const e = unary(); const r = Math.pow(b, e); if (!Number.isFinite(r)) throw new CalcError('Potensen är inte definierad eller för stor.'); return r; }
      return b;
    }
    function primary() {
      const t = toks[p];
      if (!t) throw new CalcError('Uttrycket är ofullständigt.');
      if (t.t === 'n') { p++; return t.v; }
      if (t.t === '(') { p++; const v = expr(); eat(')'); return v; }
      if (t.t === 'id') {
        p++;
        if (t.v === 'pi') return Math.PI;
        if (t.v === 'e' && peek() !== '(') return Math.E;
        const fn = Expr.FUNCS[t.v];
        if (!fn) throw new CalcError(`Okänd funktion eller konstant "${t.v}".`);
        eat('(');
        const args = [expr()];
        while (peek() === ';') { p++; args.push(expr()); }
        eat(')');
        if (fn[0] > 0 && args.length !== fn[0]) throw new CalcError(`${t.v} kräver ${fn[0]} argument.`);
        const f = t.v;
        const toR = x => deg ? x * Math.PI / 180 : x;
        const fromR = x => deg ? x * 180 / Math.PI : x;
        if (f === 'sin') return Math.sin(toR(args[0]));
        if (f === 'cos') return Math.cos(toR(args[0]));
        if (f === 'tan') {
          const cc = Math.cos(toR(args[0]));
          if (Math.abs(cc) < 1e-15) throw new CalcError('tan är inte definierad för den vinkeln.');
          return Math.tan(toR(args[0]));
        }
        if (f === 'asin' || f === 'acos') { if (args[0] < -1 || args[0] > 1) throw new CalcError(f + ' kräver ett värde mellan −1 och 1.'); return fromR(Math[f](args[0])); }
        if (f === 'atan') return fromR(Math.atan(args[0]));
        return fn[1](...args);
      }
      throw new CalcError(`Oväntat tecken "${t.t}".`);
    }
    const v = expr();
    if (p < toks.length) throw new CalcError(`Oväntat tecken "${toks[p].t === 'n' ? toks[p].v : toks[p].t === 'id' ? toks[p].v : toks[p].t}" – operator saknas?`);
    if (!Number.isFinite(v)) throw new CalcError('Resultatet är inte ett ändligt tal.');
    return v;
  },
};

/* ---------- Notation: matematisk text i HTML ---------- */
const N = {
  F: (n, d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`,
  sub: (a, b) => `${a}<sub>${b}</sub>`,
  sup: (a, b) => `${a}<sup>${b}</sup>`,
  rt: x => `√<span class="rt">${x}</span>`,
};

/* ---------- Statistik ---------- */
const Stat = {
  mean: a => Util.sum(a) / a.length,
  rms: a => Math.sqrt(Util.sum(a.map(x => x * x)) / a.length),
  stdS(a) { if (a.length < 2) return NaN; const m = Stat.mean(a); return Math.sqrt(Util.sum(a.map(x => (x - m) * (x - m))) / (a.length - 1)); },
  min: a => a.reduce((x, y) => Math.min(x, y), Infinity),
  max: a => a.reduce((x, y) => Math.max(x, y), -Infinity),
  peakAbs: a => a.reduce((x, y) => Math.max(x, Math.abs(y)), 0),
};

/* ---------- Charts: enkel inline-SVG ---------- */
const Charts = {
  /** Min/max-decimering: behåller största och minsta värdet i varje intervall så att toppar syns. */
  decimate(xs, ys, buckets) {
    const n = ys.length, k = Math.ceil(n / buckets), ox = [], oy = [];
    for (let s = 0; s < n; s += k) {
      let iMin = s, iMax = s;
      for (let i = s; i < Math.min(s + k, n); i++) { if (ys[i] < ys[iMin]) iMin = i; if (ys[i] > ys[iMax]) iMax = i; }
      for (const i of iMin <= iMax ? [iMin, iMax] : [iMax, iMin]) { if (!ox.length || ox[ox.length - 1] !== xs[i]) { ox.push(xs[i]); oy.push(ys[i]); } }
    }
    return [ox, oy];
  },
  line(xs, ys, o) {
    o = o || {};
    if (ys.length > 1200) { [xs, ys] = Charts.decimate(xs, ys, 600); o = Object.assign({}, o, { title: (o.title || 'Diagram') + ' (förenklat – toppvärden bevarade)' }); }
    const W = 600, H = 260, L = 56, R = 14, T = 14, B = 38;
    const n = ys.length;
    if (!n) return '';
    let ymin = Math.min(...ys), ymax = Math.max(...ys);
    if (o.mean !== undefined) { ymin = Math.min(ymin, o.mean); ymax = Math.max(ymax, o.mean); }
    if (ymin === ymax) { ymin -= 1; ymax += 1; }
    const pad = (ymax - ymin) * 0.08; ymin -= pad; ymax += pad;
    let xmin = Math.min(...xs), xmax = Math.max(...xs);
    if (xmin === xmax) { xmin -= 1; xmax += 1; }
    const sx = x => L + (x - xmin) / (xmax - xmin) * (W - L - R);
    const sy = y => T + (1 - (y - ymin) / (ymax - ymin)) * (H - T - B);
    let g = '';
    for (let k = 0; k <= 4; k++) {
      const yv = ymin + (ymax - ymin) * k / 4, yy = sy(yv);
      g += `<line class="ax" x1="${L}" x2="${W - R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}"/><text x="${L - 6}" y="${(yy + 4).toFixed(1)}" text-anchor="end">${Util.esc(Format.num(yv, 3))}</text>`;
    }
    const tickN = Math.min(n, 6);
    for (let k = 0; k < tickN; k++) {
      const xv = xmin + (xmax - xmin) * k / Math.max(tickN - 1, 1);
      g += `<text x="${sx(xv).toFixed(1)}" y="${H - B + 16}" text-anchor="middle">${Util.esc(Format.num(xv, 3))}</text>`;
    }
    const pts = xs.map((x, i) => `${sx(x).toFixed(1)},${sy(ys[i]).toFixed(1)}`);
    const dots = n <= 60 ? xs.map((x, i) => `<circle class="pt" cx="${sx(x).toFixed(1)}" cy="${sy(ys[i]).toFixed(1)}" r="3"/>`).join('') : '';
    const mean = o.mean !== undefined ? `<line class="mean" x1="${L}" x2="${W - R}" y1="${sy(o.mean).toFixed(1)}" y2="${sy(o.mean).toFixed(1)}"/><text x="${W - R}" y="${(sy(o.mean) - 5).toFixed(1)}" text-anchor="end">medel</text>` : '';
    const xl = o.xlabel ? `<text x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle">${Util.esc(o.xlabel)}</text>` : '';
    const yl = o.ylabel ? `<text x="12" y="${(T + H - B) / 2}" text-anchor="middle" transform="rotate(-90 12 ${(T + H - B) / 2})">${Util.esc(o.ylabel)}</text>` : '';
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${Util.esc(o.title || 'Diagram')}"><title>${Util.esc(o.title || 'Diagram')}</title>${g}<polyline class="ln" points="${pts.join(' ')}"/>${mean}${dots}${xl}${yl}</svg>`;
  },
};

/* ---------- Store: localStorage med felhantering och minnesreserv ---------- */
const DEFAULT_DATA = () => ({
  favs: [], history: [], saved: [], projects: [],
  journal: [], fractures: [], rocknotes: [], sources: [], risknotes: [], assumptions: [], reviewnotes: [],
  quick: [],
  prefs: { theme: 'dark', sig: 6, g: 9.81, scanline: '', scanlines: {} },
});
const COLLECTIONS = ['history', 'saved', 'projects', 'journal', 'fractures', 'rocknotes', 'sources', 'risknotes', 'assumptions', 'reviewnotes'];
const Store = {
  KEY: 'bergpro.v1', ok: false, data: DEFAULT_DATA(), onError: null, backend: null,
  init(backend) {
    try {
      /* Åtkomst till localStorage kan själv kasta fel (blockerade cookies, vissa privata lägen). */
      this.backend = backend !== undefined ? backend : (typeof localStorage !== 'undefined' ? localStorage : null);
      if (!this.backend) throw new Error('ingen lagring');
      this.backend.setItem('__bp_test', '1');
      if (this.backend.getItem('__bp_test') !== '1') throw new Error('läsning misslyckades');
      this.backend.removeItem('__bp_test');
      this.ok = true;
    } catch (e) { this.ok = false; }
    if (this.ok) {
      try {
        const raw = this.backend.getItem(this.KEY);
        this.firstRun = !raw;
        if (raw) { const res = Store.validate(JSON.parse(raw), true); if (res.clean) this.data = res.clean; }
      } catch (e) { /* korrupt data → börja om tomt */ }
    }
    CFG.sig = this.data.prefs.sig || 6;
    return this.ok;
  },
  save() {
    if (!this.ok) return false;
    for (let attempt = 0; attempt < 8; attempt++) {
      try {
        this.backend.setItem(this.KEY, JSON.stringify(this.data));
        if (attempt && this.onError) this.onError('Lagringen var full – de äldsta historikposterna togs bort. Sparade resultat och projekt påverkades inte.');
        return true;
      } catch (e) {
        /* Full lagring (vanligt på telefoner): ta bort äldsta hälften av historiken och försök igen. */
        if (this.data.history.length > 10) { this.data.history.length = Math.floor(this.data.history.length / 2); continue; }
        break;
      }
    }
    if (this.onError) this.onError('Kunde inte spara – lagringen är full eller blockerad. Exportera dina data till JSON.');
    return false;
  },
  add(coll, rec) { rec.id = rec.id || Util.uid(); rec.t = rec.t || Date.now(); this.data[coll].unshift(rec); this.save(); return rec; },
  get(coll, id) { return this.data[coll].find(x => x.id === id); },
  update(coll, id, patch) { const r = this.get(coll, id); if (r) { Object.assign(r, patch); this.save(); } return r; },
  remove(coll, id) { this.data[coll] = this.data[coll].filter(x => x.id !== id); this.save(); },
  clear(coll) { this.data[coll] = []; this.save(); },
  isFav(key) { return this.data.favs.includes(key); },
  toggleFav(key) { const i = this.data.favs.indexOf(key); if (i >= 0) this.data.favs.splice(i, 1); else this.data.favs.unshift(key); this.save(); return i < 0; },
  pref(k, v) { if (v !== undefined) { this.data.prefs[k] = v; this.save(); } return this.data.prefs[k]; },
  exportObj() { return { app: 'BergPro', version: 1, exported: new Date().toISOString(), notice: 'Resultat där calc = "blast_model" (eller meta.type = "unverified") kommer från en EJ VERIFIERAD egen modell – inte dimensioneringsunderlag och inte ett tändintervall. Poster från äldre versioner kan sakna meta och kan ha B i annan enhet än meter – räkna om i appen.', data: this.data }; },
  /** Rensar och validerar importdata. Returnerar {clean, errors[], warnings[]}. */
  validate(obj, silent) {
    const errors = [], warnings = [];
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return { clean: null, errors: ['Filen innehåller inget giltigt JSON-objekt.'], warnings };
    let d = obj;
    if (obj.app !== undefined || obj.data !== undefined) {
      if (obj.app !== 'BergPro') errors.push('Filen är inte en BergPro-export (fältet "app" saknas eller är fel).');
      if (typeof obj.version !== 'number' || obj.version > 1) errors.push('Okänd eller för ny exportversion.');
      d = obj.data;
      if (!d || typeof d !== 'object') errors.push('Fältet "data" saknas.');
    }
    if (errors.length) return { clean: null, errors, warnings };
    const clean = DEFAULT_DATA();
    const cleanVal = (v, depth) => {
      if (depth > 5) return undefined;
      if (typeof v === 'string') return v.slice(0, 5000);
      if (typeof v === 'number') return Number.isFinite(v) ? v : undefined;
      if (typeof v === 'boolean' || v === null) return v;
      if (Array.isArray(v)) return v.slice(0, 5000).map(x => cleanVal(x, depth + 1)).filter(x => x !== undefined);
      if (typeof v === 'object') {
        const o = {};
        for (const k of Object.keys(v)) { if (k === '__proto__' || k === 'constructor' || k === 'prototype') continue; const c = cleanVal(v[k], depth + 1); if (c !== undefined) o[k] = c; }
        return o;
      }
      return undefined;
    };
    if (d.favs !== undefined) {
      if (!Array.isArray(d.favs)) errors.push('"favs" måste vara en lista.');
      else clean.favs = d.favs.filter(x => typeof x === 'string' && /^[cft]:[\w.-]+$/.test(x));
    }
    if (d.quick !== undefined) {
      if (!Array.isArray(d.quick)) errors.push('"quick" måste vara en lista.');
      else clean.quick = d.quick.filter(x => x && typeof x.e === 'string' && typeof x.r === 'string').slice(0, 30).map(x => ({ e: x.e.slice(0, 300), r: x.r.slice(0, 60) }));
    }
    for (const c of COLLECTIONS) {
      if (d[c] === undefined) continue;
      if (!Array.isArray(d[c])) { errors.push(`"${c}" måste vara en lista.`); continue; }
      const out = [];
      d[c].forEach((it, i) => {
        if (!it || typeof it !== 'object' || Array.isArray(it)) { warnings.push(`${c}[${i}] hoppades över (inte ett objekt).`); return; }
        const rec = cleanVal(it, 0);
        if (typeof rec.id !== 'string' || !rec.id) rec.id = Util.uid();
        if (typeof rec.t !== 'number') rec.t = Date.now();
        if ((c === 'history' || c === 'saved') && (typeof rec.calc !== 'string' || !Array.isArray(rec.results))) { warnings.push(`${c}[${i}] hoppades över (saknar beräkning/resultat).`); return; }
        if (c === 'projects' && (typeof rec.name !== 'string' || !rec.name.trim())) { warnings.push(`Projekt ${i + 1} hoppades över (saknar namn).`); return; }
        out.push(rec);
      });
      clean[c] = out;
    }
    if (d.prefs !== undefined) {
      if (typeof d.prefs !== 'object' || !d.prefs) errors.push('"prefs" måste vara ett objekt.');
      else {
        const p = d.prefs;
        if (p.theme === 'dark' || p.theme === 'light') clean.prefs.theme = p.theme;
        if (Number.isInteger(p.sig) && p.sig >= 3 && p.sig <= 10) clean.prefs.sig = p.sig;
        if (typeof p.g === 'number' && p.g > 9 && p.g < 10) clean.prefs.g = p.g;
        if (typeof p.scanline === 'string') clean.prefs.scanline = p.scanline.slice(0, 20);
        if (p.scanlines && typeof p.scanlines === 'object' && !Array.isArray(p.scanlines)) for (const [k, x] of Object.entries(p.scanlines).slice(0, 500)) { if (typeof x === 'number' && x > 0 && Number.isFinite(x) && k !== '__proto__') clean.prefs.scanlines[String(k).slice(0, 200)] = x; }
      }
    }
    if (errors.length) return { clean: null, errors, warnings };
    return { clean, errors, warnings };
  },
  /** Importera. mode: 'merge' (slå ihop på id) eller 'replace'. */
  importData(clean, mode) {
    if (mode === 'replace') { this.data = clean; }
    else {
      for (const c of COLLECTIONS) {
        const have = new Set(this.data[c].map(x => x.id));
        clean[c].forEach(x => { if (!have.has(x.id)) this.data[c].push(x); });
        this.data[c].sort((a, b) => (b.t || 0) - (a.t || 0));
      }
      clean.favs.forEach(f => { if (!this.data.favs.includes(f)) this.data.favs.push(f); });
      clean.quick.forEach(q => { if (!this.data.quick.some(z => z.e === q.e)) this.data.quick.push(q); });
    }
    CFG.sig = this.data.prefs.sig;
    return this.save();
  },
};

/* ---------- Kalkylatorer ---------- */
const CALCS = [];
/** Inmatningsfält (tal). o: unitGroup, unit, gt0, ge0, ne0, int, opt, defVal, def, hint, noConv, check */
const I = (id, label, o) => Object.assign({ id, label, type: 'num' }, o || {});
const LIST = (id, label, o) => Object.assign({ id, label, type: 'list', min: 1 }, o || {});
const SEL = (id, label, options, o) => Object.assign({ id, label, type: 'select', options }, o || {});
const TXT = (id, label, o) => Object.assign({ id, label, type: 'text', opt: true }, o || {});
const R = (label, value, unit, sym) => ({ label, value, unit, sym });
const RT = (label, text) => ({ label, text });
/** Resultatrader i flera enheter; första raden är huvudresultat. */
function multi(label, sym, base, group, keys) {
  return keys.map((k, i) => ({ label: i === 0 ? label : '', sym: i === 0 ? sym : '', value: Units.fromBase(group, k, base), unit: Units.label(group, k), alt: i > 0 }));
}
function calc(o) { CALCS.push(o); return o; }
const fmt = Format.num;
const WARN_REAL = 'Verkligt berg är ofta sprucket och kan ha riktningsberoende egenskaper – modellen är en idealisering.';
const unitOf = (v, id) => v._ul[id] || '';

/* --- Geometri och volym --- */
const RD = [['r', 'Radie'], ['d', 'Diameter']];
const radiusOf = v => (v.mode === 'd' ? v.r / 2 : v.r);
calc({ id: 'area_rect', f: 'area_rect', cat: 'geo', title: 'Rektangulär area', desc: 'Area = bredd × höjd.', syn: ['yta', 'kvadrat'],
  inputs: [I('b', 'Bredd b', { unitGroup: 'length', unit: 'm', gt0: 1 }), I('h', 'Höjd h', { unitGroup: 'length', unit: 'm', gt0: 1 })],
  compute(v, c) { const A = v.b * v.h; return { results: multi('Area', 'A', A, 'area', ['m2', 'cm2', 'mm2']), steps: [`A = b · h = ${c.disp('b')} · ${c.disp('h')}`, `A = ${fmt(A)} m²`] }; } });
calc({ id: 'area_tri', f: 'area_tri', cat: 'geo', title: 'Triangelarea', desc: 'Area = ½ × bas × höjd.', syn: ['yta'],
  inputs: [I('b', 'Bas b', { unitGroup: 'length', unit: 'm', gt0: 1 }), I('h', 'Höjd h (vinkelrät mot basen)', { unitGroup: 'length', unit: 'm', gt0: 1 })],
  compute(v, c) { const A = 0.5 * v.b * v.h; return { results: multi('Area', 'A', A, 'area', ['m2', 'cm2', 'mm2']), steps: [`A = ½ · b · h = 0,5 · ${c.disp('b')} · ${c.disp('h')}`, `A = ${fmt(A)} m²`] }; } });
calc({ id: 'area_circle', f: 'area_circle', cat: 'geo', title: 'Cirkelarea', desc: 'Area = π·r². Ange radie eller diameter (t.ex. borrhål).', syn: ['cirkel', 'borrhål'],
  inputs: [SEL('mode', 'Jag anger', RD, { def: 'r' }), I('r', 'Mått', { unitGroup: 'length', unit: 'm', gt0: 1 })],
  compute(v, c) { const r = radiusOf(v), A = Math.PI * r * r; return { results: multi('Area', 'A', A, 'area', ['m2', 'cm2', 'mm2']), steps: [`r = ${fmt(r)} m`, `A = π · r² = π · ${fmt(r)}² = ${fmt(A)} m²`] }; } });
calc({ id: 'circ', f: 'circ', cat: 'geo', title: 'Cirkelomkrets', desc: 'Omkrets = 2·π·r.', syn: ['periferi'],
  inputs: [SEL('mode', 'Jag anger', RD, { def: 'r' }), I('r', 'Mått', { unitGroup: 'length', unit: 'm', gt0: 1 })],
  compute(v) { const r = radiusOf(v), C = 2 * Math.PI * r; return { results: multi('Omkrets', 'C', C, 'length', ['m', 'cm', 'mm']), steps: [`r = ${fmt(r)} m`, `C = 2 · π · r = ${fmt(C)} m`] }; } });
calc({ id: 'vol_box', f: 'vol_box', cat: 'geo', also: ['quick'], title: 'Rätblockets volym', desc: 'Volym = längd × bredd × höjd.', syn: ['kubik', 'volym', 'kvader'],
  inputs: [I('l', 'Längd l', { unitGroup: 'length', unit: 'm', gt0: 1 }), I('b', 'Bredd b', { unitGroup: 'length', unit: 'm', gt0: 1 }), I('h', 'Höjd h', { unitGroup: 'length', unit: 'm', gt0: 1 })],
  compute(v, c) { const V = v.l * v.b * v.h; return { results: multi('Volym', 'V', V, 'volume', ['m3', 'l']), steps: [`V = l · b · h = ${c.disp('l')} · ${c.disp('b')} · ${c.disp('h')}`, `V = ${fmt(V)} m³`] }; } });
calc({ id: 'vol_cyl', f: 'vol_cyl', cat: 'geo', title: 'Cylindervolym', desc: 'Volym = π·r²·h. Ange radie eller diameter.', syn: ['borrhål', 'rör'],
  inputs: [SEL('mode', 'Jag anger', RD, { def: 'r' }), I('r', 'Mått', { unitGroup: 'length', unit: 'm', gt0: 1 }), I('h', 'Höjd/längd h', { unitGroup: 'length', unit: 'm', gt0: 1 })],
  compute(v) { const r = radiusOf(v), V = Math.PI * r * r * v.h; return { results: multi('Volym', 'V', V, 'volume', ['m3', 'l']), steps: [`r = ${fmt(r)} m, h = ${fmt(v.h)} m`, `V = π · r² · h = ${fmt(V)} m³`] }; } });
calc({ id: 'vol_trap', f: 'vol_trap', cat: 'geo', title: 'Volym mellan tvärsektioner', desc: 'Trapetsmetoden (medelarea × avstånd) för flera sektioner.', syn: ['massberäkning', 'tunnel', 'schakt'],
  inputs: [{ id: 'sec', type: 'pairs', label: 'Sektioner (en per rad: station area)', min: 2, hint: 'Ex.\n0 12,5\n10 14\n20 13,2', cols: [{ label: 'Station s', unitGroup: 'length', unit: 'm', asc: true }, { label: 'Area A', unitGroup: 'area', unit: 'm2', ge0: true }] }],
  compute(v) {
    const rows = v.sec; let V = 0; const body = [];
    for (let i = 0; i < rows.length - 1; i++) {
      const ds = rows[i + 1][0] - rows[i][0], am = (rows[i][1] + rows[i + 1][1]) / 2, dv = am * ds; V += dv;
      body.push([`${fmt(rows[i][0])} → ${fmt(rows[i + 1][0])}`, fmt(ds), fmt(am), fmt(dv)]);
    }
    return { results: multi('Volym', 'V', V, 'volume', ['m3']), steps: [`${rows.length - 1} intervall, V = Σ (Aᵢ + Aᵢ₊₁)/2 · Δs`, `V = ${fmt(V)} m³`],
      table: { head: ['Intervall (m)', 'Δs (m)', 'Medelarea (m²)', 'ΔV (m³)'], rows: body, num: [1, 2, 3] },
      chart: Charts.line(rows.map(r => r[0]), rows.map(r => r[1]), { title: 'Tvärsnittsarea mot station', xlabel: 'Station (m)', ylabel: 'Area (m²)' }),
      warnings: rows.length === 2 ? ['Endast två sektioner – resultatet blir en enkel medelarea × avstånd.'] : [] };
  } });
calc({ id: 'mass_from_vol', f: 'mass_from_vol', cat: 'geo', title: 'Massa från volym och densitet', desc: 'm = ρ · V.', syn: ['vikt', 'ton'],
  inputs: [I('V', 'Volym V', { unitGroup: 'volume', unit: 'm3', gt0: 1 }), I('rho', 'Densitet ρ', { unitGroup: 'density', unit: 'tm3', gt0: 1 })],
  compute(v, c) { const m = v.rho * v.V; return { results: multi('Massa', 'm', m, 'mass', ['t', 'kg']), steps: [`m = ρ · V = ${c.disp('rho')} · ${c.disp('V')}`, `m = ${fmt(m)} kg`] }; } });
calc({ id: 'vol_from_mass', f: 'vol_from_mass', cat: 'geo', title: 'Volym från massa och densitet', desc: 'V = m / ρ.', syn: ['ton till kubik'],
  inputs: [I('m', 'Massa m', { unitGroup: 'mass', unit: 't', gt0: 1 }), I('rho', 'Densitet ρ', { unitGroup: 'density', unit: 'tm3', gt0: 1 })],
  compute(v, c) { const V = v.m / v.rho; return { results: multi('Volym', 'V', V, 'volume', ['m3', 'l']), steps: [`V = m / ρ = ${c.disp('m')} / ${c.disp('rho')}`, `V = ${fmt(V)} m³`] }; } });

/* --- Bergmekanik --- */
const STRESS_OUT = ['mpa', 'kpa', 'pa'];
calc({ id: 'stress_n', f: 'stress_n', cat: 'rockmech', also: ['quick'], title: 'Normalspänning', desc: 'σ = F / A.', syn: ['tryckspänning', 'last'],
  inputs: [I('F', 'Kraft F (vinkelrät)', { unitGroup: 'force', unit: 'kn_' }), I('A', 'Area A', { unitGroup: 'area', unit: 'm2', gt0: 1 })],
  compute(v, c) { const s = v.F / v.A; return { results: multi('Normalspänning', 'σ', s, 'pressure', STRESS_OUT), steps: [`σ = F / A = ${c.disp('F')} / ${c.disp('A')}`, `σ = ${fmt(s)} Pa`], warnings: [WARN_REAL] }; } });
calc({ id: 'stress_s', f: 'stress_s', cat: 'rockmech', title: 'Skjuvspänning', desc: 'τ = Fₛ / A.', syn: ['tangentialspänning'],
  inputs: [I('F', 'Skjuvkraft Fₛ (parallell med ytan)', { unitGroup: 'force', unit: 'kn_' }), I('A', 'Area A', { unitGroup: 'area', unit: 'm2', gt0: 1 })],
  compute(v, c) { const s = v.F / v.A; return { results: multi('Skjuvspänning', 'τ', s, 'pressure', STRESS_OUT), steps: [`τ = Fₛ / A = ${c.disp('F')} / ${c.disp('A')}`, `τ = ${fmt(s)} Pa`], warnings: [WARN_REAL] }; } });
calc({ id: 'strain', f: 'strain', cat: 'rockmech', title: 'Relativ deformation', desc: 'ε = ΔL / L₀.', syn: ['töjning', 'sammantryckning'],
  inputs: [I('dL', 'Längdändring ΔL', { unitGroup: 'length', unit: 'mm', hint: 'Negativt värde = förkortning.' }), I('L0', 'Ursprunglig längd L₀', { unitGroup: 'length', unit: 'mm', gt0: 1 })],
  compute(v, c) { const e = v.dL / v.L0; return { results: multi('Relativ deformation', 'ε', e, 'strain', ['one', 'pct', 'ue']), steps: [`ε = ΔL / L₀ = ${c.disp('dL')} / ${c.disp('L0')}`, `ε = ${fmt(e)}`] }; } });
calc({ id: 'young', f: 'young', cat: 'rockmech', title: 'Elasticitetsmodul', desc: 'E = σ / ε.', syn: ['e-modul', 'styvhet'],
  inputs: [I('sig', 'Spänning σ', { unitGroup: 'pressure', unit: 'mpa' }), I('eps', 'Töjning ε', { unitGroup: 'strain', unit: 'one', ne0: 1 })],
  compute(v, c) {
    const E = v.sig / v.eps; const w = [WARN_REAL];
    if (E < 0) w.push('Negativt E: spänning och töjning har olika tecken – kontrollera teckenkonventionen.');
    return { results: multi('Elasticitetsmodul', 'E', E, 'pressure', ['gpa', 'mpa']), steps: [`E = σ / ε = ${c.disp('sig')} / ${c.disp('eps')}`, `E = ${fmt(E)} Pa`], warnings: w };
  } });
calc({ id: 'poisson', f: 'poisson', cat: 'rockmech', title: 'Poissons tal', desc: 'ν = −ε_tvär / ε_axiell.', syn: ['tvärkontraktion'],
  inputs: [I('el', 'Tvärgående töjning ε_tvär', { unitGroup: 'strain', unit: 'one' }), I('ea', 'Axiell töjning ε_axiell', { unitGroup: 'strain', unit: 'one', ne0: 1 })],
  compute(v, c) {
    const nu = -v.el / v.ea; const w = [WARN_REAL];
    if (nu >= 0.5 || nu <= -1) throw new CalcError('ν = ' + fmt(nu) + ' är inte fysikaliskt för ett isotropt linjärelastiskt material (−1 < ν < 0,5). Kontrollera tecken och värden.', 'el');
    if (nu < 0) w.push('Negativt Poissons tal är ovanligt – kontrollera tecknen på töjningarna.');
    return { results: [R('Poissons tal', nu, '–', 'ν')], steps: [`ν = −ε_tvär / ε_axiell = −(${c.disp('el')}) / (${c.disp('ea')})`, `ν = ${fmt(nu)}`], warnings: w };
  } });
const NU_CHECK = x => (x <= -1 || x >= 0.5 ? 'Poissons tal måste vara större än −1 och mindre än 0,5.' : null);
calc({ id: 'shear_mod', f: 'shear_mod', cat: 'rockmech', title: 'Skjuvmodul', desc: 'G = E / (2·(1+ν)).', syn: ['g-modul'],
  inputs: [I('E', 'Elasticitetsmodul E', { unitGroup: 'pressure', unit: 'gpa', gt0: 1 }), I('nu', 'Poissons tal ν', { check: NU_CHECK, hint: 'Från provning eller verifierad källa. Appen fyller inte i något värde.' })],
  compute(v, c) { const G = v.E / (2 * (1 + v.nu)); return { results: multi('Skjuvmodul', 'G', G, 'pressure', ['gpa', 'mpa']), steps: [`G = E / (2·(1+ν)) = ${c.disp('E')} / (2 · (1 + ${fmt(v.nu)}))`, `G = ${fmt(G)} Pa`], warnings: [WARN_REAL, 'Förutsätter isotropt, linjärelastiskt material.'] }; } });
calc({ id: 'bulk_mod', f: 'bulk_mod', cat: 'rockmech', title: 'Volymmodul', desc: 'K = E / (3·(1−2ν)).', syn: ['kompressionsmodul'],
  inputs: [I('E', 'Elasticitetsmodul E', { unitGroup: 'pressure', unit: 'gpa', gt0: 1 }), I('nu', 'Poissons tal ν', { check: NU_CHECK, hint: 'Från provning eller verifierad källa. Appen fyller inte i något värde.' })],
  compute(v, c) { const K = v.E / (3 * (1 - 2 * v.nu)); return { results: multi('Volymmodul', 'K', K, 'pressure', ['gpa', 'mpa']), steps: [`K = E / (3·(1−2ν)) = ${c.disp('E')} / (3 · (1 − 2 · ${fmt(v.nu)}))`, `K = ${fmt(K)} Pa`], warnings: [WARN_REAL, 'Förutsätter isotropt, linjärelastiskt material.'] }; } });
calc({ id: 'density', f: 'density', cat: 'rockmech', also: ['quick'], title: 'Densitet', desc: 'ρ = m / V.', syn: ['täthet', 'skrymdensitet'],
  inputs: [I('m', 'Massa m', { unitGroup: 'mass', unit: 'kg', ge0: 1 }), I('V', 'Volym V', { unitGroup: 'volume', unit: 'm3', gt0: 1 })],
  compute(v, c) { const r = v.m / v.V; return { results: multi('Densitet', 'ρ', r, 'density', ['kgm3', 'gcm3', 'tm3']), steps: [`ρ = m / V = ${c.disp('m')} / ${c.disp('V')}`, `ρ = ${fmt(r)} kg/m³`], warnings: ['Ange om provet är torrt, naturfuktigt eller mättat – värdet gäller bara för det tillståndet.'] }; } });
calc({ id: 'unit_weight', f: 'unit_weight', cat: 'rockmech', title: 'Tunghet', desc: 'γ = ρ · g.', syn: ['viktdensitet'],
  inputs: [I('rho', 'Densitet ρ', { unitGroup: 'density', unit: 'kgm3', ge0: 1 }), I('g', 'Tyngdacceleration g', { unitGroup: 'accel', unit: 'ms2', gt0: 1, def: '@g', hint: 'Standard: 9,80665 m/s². Förinställt värde kan ändras i Inställningar.' })],
  compute(v, c) { const gam = v.rho * v.g; return { results: [R('Tunghet', gam / 1000, 'kN/m³', 'γ'), { label: '', value: gam, unit: 'N/m³', alt: true }], steps: [`γ = ρ · g = ${c.disp('rho')} · ${c.disp('g')}`, `γ = ${fmt(gam)} N/m³ = ${fmt(gam / 1000)} kN/m³`] }; } });
calc({ id: 'eff_stress', f: 'eff_stress', cat: 'rockmech', title: 'Effektiv normalspänning', desc: "σ′ = σ − u.", syn: ['portryck', 'vattentryck'],
  inputs: [I('s', 'Total normalspänning σ', { unitGroup: 'pressure', unit: 'kpa' }), I('u', 'Portryck u', { unitGroup: 'pressure', unit: 'kpa', ge0: 1 })],
  compute(v, c) {
    const e = v.s - v.u; const w = [WARN_REAL, 'Kompression är positiv. Principen gäller vattenmättade medier och förutsätter Biots koefficient α = 1 (vanligt för sprickor). För intakt berg kan α < 1 – då ger formeln för låg effektivspänning.'];
    if (e < 0) w.push("Negativ effektiv spänning (σ′ < 0): portrycket överstiger normalspänningen – kontakten kan öppnas.");
    return { results: multi('Effektiv normalspänning', "σ′", e, 'pressure', ['kpa', 'mpa', 'pa']), steps: [`σ′ = σ − u = ${c.disp('s')} − ${c.disp('u')}`, `σ′ = ${fmt(e)} Pa`], warnings: w };
  } });
calc({ id: 'mohr', f: 'mohr', cat: 'rockmech', title: 'Mohr–Coulomb (idealiserat)', desc: 'τ_f = c + σ′·tanφ, valfritt med säkerhetsfaktor.', syn: ['brott', 'friktion', 'kohesion', 'säkerhetsfaktor'],
  inputs: [I('c', 'Kohesion c', { unitGroup: 'pressure', unit: 'kpa', ge0: 1 }), I('phi', 'Friktionsvinkel φ', { unitGroup: 'angle', unit: 'deg', check: x => (x < 0 || x >= Math.PI / 2 - 1e-12 ? 'Friktionsvinkeln måste vara ≥ 0° och < 90°.' : null) }),
    I('sn', 'Total normalspänning σ (tryck positivt)', { unitGroup: 'pressure', unit: 'kpa' }), I('u', 'Portryck u', { unitGroup: 'pressure', unit: 'kpa', ge0: 1, opt: true, defVal: 0, hint: 'Lämna tomt för 0 (torrt).' }),
    I('tau', 'Pålagd skjuvspänning τ (valfritt, för säkerhetsfaktor)', { unitGroup: 'pressure', unit: 'kpa', opt: true, gt0: 1 })],
  compute(v, c) {
    const se = v.sn - v.u; const w = [WARN_REAL, 'Idealiserad linjär brottkurva; c och φ måste komma från provning eller verifierad källa.'];
    if (se < 0) throw new CalcError("Effektiv normalspänning σ′ = σ − u är negativ – Mohr–Coulomb-uttrycket med σ′·tanφ är inte tillämpligt (dra/separation).", 'sn');
    const tf = v.c + se * Math.tan(v.phi);
    const out = { results: multi('Skjuvhållfasthet', 'τ_f', tf, 'pressure', ['kpa', 'mpa', 'pa']), steps: [`σ′ = σ − u = ${fmt(v.sn)} Pa − ${fmt(v.u)} Pa = ${fmt(se)} Pa`, `τ_f = c + σ′ · tan φ = ${fmt(v.c)} Pa + ${fmt(se)} Pa · tan(${fmt(v.phi * 180 / Math.PI)}°)`, `τ_f = ${fmt(tf)} Pa`], warnings: w };
    if (v.tau) { const fs = tf / v.tau; out.results.push(R('Säkerhetsfaktor τ_f / τ', fs, '–', 'FS')); out.steps.push(`FS = τ_f / τ = ${fmt(tf)} Pa / ${fmt(v.tau)} Pa = ${fmt(fs)}`); if (fs < 1) out.warnings.push('FS < 1: pålagd skjuvspänning överstiger skjuvhållfastheten i modellen.'); }
    return out;
  } });

/* --- Bergklassificering --- */
function rqdClass(r) { return r < 25 ? 'Mycket dålig' : r < 50 ? 'Dålig' : r < 75 ? 'Medelgod' : r < 90 ? 'God' : 'Utmärkt'; }
calc({ id: 'rqd', f: 'rqd', cat: 'class', title: 'RQD – kärnkvalitet', desc: 'Summa av hela kärnbitar ≥ 100 mm delat med körlängden.', syn: ['kärnloggning', 'borrkärna', 'rock quality designation'],
  inputs: [I('L', 'Körlängd (borrad längd för kärnsatsen)', { unitGroup: 'length', unit: 'm', gt0: 1 }),
    LIST('p', 'Kärnbitar – en längd per rad eller separerade med blanksteg', { unitGroup: 'length', unit: 'cm', ge0: 1, hint: 'Endast hela, naturligt separerade bitar. Mekaniska brott från borrning/hantering som passar ihop räknas som en bit. Mät längs kärnans mittlinje.' })],
  compute(v) {
    const tot = Util.sum(v.p);
    if (tot > v.L * (1 + 1e-9) + 1e-9) throw new CalcError(`Summan av kärnbitarna (${fmt(tot)} m) överstiger körlängden (${fmt(v.L)} m). Kontrollera enheter och värden.`, 'p');
    const good = v.p.filter(x => x >= 0.1 - 1e-12), sg = Util.sum(good);
    const rqd = 100 * sg / v.L;
    const w = [`Beskrivande klass enligt Deeres tabell: ${rqdClass(rqd)}. Verifiera mot projektets krav och kärndiameter (minst NX rekommenderas).`];
    return { results: [R('RQD', rqd, '%', 'RQD'), RT('Beskrivande klass (Deere)', rqdClass(rqd)), R('Summa bitar ≥ 100 mm', sg, 'm'), R('Antal bitar ≥ 100 mm', good.length, 'st'), R('Antal bitar totalt', v.p.length, 'st'), R('Registrerad kärna av körlängden', 100 * tot / v.L, '%')],
      steps: [`Σ bitar ≥ 0,1 m = ${fmt(sg)} m (av totalt ${fmt(tot)} m registrerat)`, `RQD = ${fmt(sg)} / ${fmt(v.L)} · 100 = ${fmt(rqd)} %`], warnings: w };
  } });
calc({ id: 'frac_freq', f: 'frac_freq', cat: 'class', title: 'Sprickfrekvens längs mätlinje', desc: 'λ = N / L.', syn: ['sprickor per meter', 'scanline'],
  inputs: [I('N', 'Antal sprickor N', { int: 1, ge0: 1 }), I('L', 'Mätlinjens längd L', { unitGroup: 'length', unit: 'm', gt0: 1 })],
  compute(v, c) { const lam = v.N / v.L; const res = [R('Sprickfrekvens', lam, '1/m', 'λ')]; if (v.N > 0) res.push(R('Medelavstånd', v.L / v.N, 'm', 's')); return { results: res, steps: [`λ = N / L = ${fmt(v.N)} / ${c.disp('L')}`, `λ = ${fmt(lam)} sprickor/m`], warnings: ['Resultatet beror på mätlinjens riktning i förhållande till sprickornas orientering.'] }; } });
calc({ id: 'frac_spacing', f: 'frac_spacing', cat: 'class', title: 'Medelavstånd mellan sprickor', desc: 's ≈ L / N.', syn: ['sprickavstånd'],
  inputs: [I('L', 'Mätlinjens längd L', { unitGroup: 'length', unit: 'm', gt0: 1 }), I('N', 'Antal sprickor N', { int: 1, gt0: 1 })],
  compute(v, c) { const s = v.L / v.N; return { results: [...multi('Medelavstånd', 's', s, 'length', ['m', 'cm', 'mm']), R('Sprickfrekvens', v.N / v.L, '1/m', 'λ')], steps: [`s ≈ L / N = ${c.disp('L')} / ${fmt(v.N)}`, `s ≈ ${fmt(s)} m`], warnings: ['Skenbart medelavstånd längs mätlinjen. Verkligt sprickavstånd (ISRM) mäts vinkelrätt mot sprickplanen inom en sprickgrupp och kräver vinkelkorrektion. N sprickor ger N − 1 mellanrum.'] }; } });

/* --- Vibrationer --- */
calc({ id: 'freq', f: 'freq', cat: 'vib', also: ['quick'], title: 'Frekvens från periodtid', desc: 'f = 1 / T.', syn: ['hertz'],
  inputs: [I('T', 'Periodtid T', { unitGroup: 'time', unit: 's', gt0: 1 })],
  compute(v, c) { const f = 1 / v.T; return { results: multi('Frekvens', 'f', f, 'freq', ['hz', 'khz', 'rpm']), steps: [`f = 1 / T = 1 / ${c.disp('T')}`, `f = ${fmt(f)} Hz`] }; } });
calc({ id: 'period', f: 'period', cat: 'vib', title: 'Periodtid från frekvens', desc: 'T = 1 / f.', syn: ['svängningstid'],
  inputs: [I('f', 'Frekvens f', { unitGroup: 'freq', unit: 'hz', gt0: 1 })],
  compute(v, c) { const T = 1 / v.f; return { results: multi('Periodtid', 'T', T, 'time', ['s', 'msec']), steps: [`T = 1 / f = 1 / ${c.disp('f')}`, `T = ${fmt(T)} s`] }; } });
calc({ id: 'omega', f: 'omega', cat: 'vib', title: 'Vinkelhastighet', desc: 'ω = 2·π·f.', syn: ['vinkelfrekvens'],
  inputs: [I('f', 'Frekvens f', { unitGroup: 'freq', unit: 'hz', gt0: 1 })],
  compute(v, c) { const w = 2 * Math.PI * v.f; return { results: [R('Vinkelhastighet', w, 'rad/s', 'ω'), R('Periodtid', 1 / v.f, 's', 'T')], steps: [`ω = 2 · π · f = 2 · π · ${c.disp('f')}`, `ω = ${fmt(w)} rad/s`] }; } });
calc({ id: 'harm', f: 'harm', cat: 'vib', title: 'Förskjutning, hastighet och acceleration', desc: 'Räknar mellan toppvärden för en ren sinussvängning. Fyll i exakt en storhet.', syn: ['ppv', 'partikelhastighet', 'mm/s', 'vibration'],
  inputs: [I('f', 'Frekvens f', { unitGroup: 'freq', unit: 'hz', gt0: 1 }),
    I('u', 'Förskjutning (amplitud) u', { unitGroup: 'length', unit: 'mm', opt: true, ge0: 1, hint: 'Fyll i exakt en av de tre storheterna.' }),
    I('vel', 'Hastighet (amplitud) v', { unitGroup: 'speed', unit: 'mms', opt: true, ge0: 1 }),
    I('a', 'Acceleration (amplitud) a', { unitGroup: 'accel', unit: 'ms2', opt: true, ge0: 1 })],
  compute(v, c) {
    const given = ['u', 'vel', 'a'].filter(k => v[k] !== undefined);
    if (given.length !== 1) throw new CalcError(`Fyll i exakt en av förskjutning, hastighet och acceleration (du har fyllt i ${given.length}).`, 'u');
    const w = 2 * Math.PI * v.f; let u, vv, a;
    if (given[0] === 'u') { u = v.u; vv = w * u; a = w * vv; } else if (given[0] === 'vel') { vv = v.vel; u = vv / w; a = w * vv; } else { a = v.a; vv = a / w; u = vv / w; }
    return { results: [...multi('Förskjutning (topp)', 'û', u, 'length', ['mm', 'm']), ...multi('Hastighet (topp)', 'v̂', vv, 'speed', ['mms', 'ms']), ...multi('Acceleration (topp)', 'â', a, 'accel', ['ms2', 'g'])],
      steps: [`ω = 2πf = ${fmt(w)} rad/s`, `v̂ = ω·û , â = ω·v̂ = ω²·û`, `û = ${fmt(u)} m, v̂ = ${fmt(vv)} m/s, â = ${fmt(a)} m/s²`],
      warnings: ['Gäller endast en ren sinussvängning med en enda frekvens. Verkliga signaler är bredbandiga – redovisa vilken storhet som mäts och hur toppvärdet bestämts.'] };
  } });
calc({ id: 'sine_rms', f: 'sine_rms', cat: 'vib', title: 'Sinus: topp, RMS och topp-till-topp', desc: 'Omräkning mellan amplitud och effektivvärde för ren sinus.', syn: ['effektivvärde', 'amplitud'],
  inputs: [SEL('mode', 'Jag anger', [['peak', 'Toppvärde (amplitud)'], ['rms', 'RMS-värde']], { def: 'peak' }), I('x', 'Värde', { noConv: 1, ge0: 1 }), TXT('unit', 'Enhet (valfri)', { hint: 'T.ex. mm/s' })],
  compute(v) {
    const pk = v.mode === 'peak' ? v.x : v.x * Math.SQRT2, rms = pk / Math.SQRT2, u = v.unit || '';
    const w = ['Gäller endast ren sinus utan likkomponent.']; if (/db/i.test(u)) w.unshift('Sambandet gäller amplituder (t.ex. mm/s eller Pa), inte nivåer i dB – resultatet är meningslöst för dB-värden.');
    return { results: [R('Toppvärde', pk, u, 'x_topp'), R('RMS', rms, u, 'x_RMS'), R('Topp-till-topp', 2 * pk, u, 'x_pp')], steps: [`x_RMS = x_topp / √2 , x_pp = 2 · x_topp`, `x_topp = ${fmt(pk)} ${u}`], warnings: w };
  } });

/* --- Mätning och signalanalys --- */
const UNIT_TXT = TXT('unit', 'Enhet (valfri)', { hint: 'Visas bredvid resultaten, t.ex. mm/s.' });
const VALS = (o) => LIST('x', 'Mätvärden (separera med blanksteg, radbrytning eller semikolon)', Object.assign({ noConv: 1, hint: 'Decimalkomma eller punkt. Exempel: 2,1 3,4 2,8 3,0' }, o));
const statCalc = (id, title, desc, syn, fn, o) => calc(Object.assign({ id, f: id, cat: 'meas', title, desc, syn, inputs: [VALS(o && o.min ? { min: o.min } : {}), UNIT_TXT],
  compute(v) { const r = fn(v.x), u = v.unit || ''; return { results: [R(title, r.val, r.u === undefined ? u : r.u, r.sym), R('Antal värden', v.x.length, 'st')], steps: r.steps(u), warnings: r.w || [] }; } }, o && o.extra));
statCalc('mean', 'Aritmetiskt medelvärde', 'x̄ = Σxᵢ / n.', ['genomsnitt', 'medel'], a => { const m = Stat.mean(a); return { val: m, sym: 'x̄', steps: u => [`Σx = ${fmt(Util.sum(a))}, n = ${a.length}`, `x̄ = ${fmt(m)} ${u}`] }; }, { extra: { also: ['quick'] } });
statCalc('rms', 'RMS (effektivvärde)', 'x_RMS = √(Σxᵢ² / N).', ['effektivvärde', 'kvadratiskt medelvärde'], a => { const r = Stat.rms(a); return { val: r, sym: 'x_RMS', steps: u => [`Σx² = ${fmt(Util.sum(a.map(x => x * x)))}, N = ${a.length}`, `x_RMS = √(Σx²/N) = ${fmt(r)} ${u}`] }; }, { extra: { also: ['quick'] } });
statCalc('peak', 'Toppvärde', 'Största absolutvärdet i serien.', ['max', 'ppv', 'maxvärde'], a => { const p = Stat.peakAbs(a); return { val: p, sym: 'x_topp', steps: u => [`max = ${fmt(Stat.max(a))}, min = ${fmt(Stat.min(a))}`, `x_topp = max|x| = ${fmt(p)} ${u}`] }; });
statCalc('p2p', 'Topp-till-topp-värde', 'Största minus minsta värde.', ['peak to peak', 'spännvidd'], a => { const p = Stat.max(a) - Stat.min(a); return { val: p, sym: 'x_pp', steps: u => [`max = ${fmt(Stat.max(a))}, min = ${fmt(Stat.min(a))}`, `x_pp = ${fmt(p)} ${u}`], w: a.length < 2 ? ['Med ett enda värde blir topp-till-topp 0.'] : [] }; });
statCalc('stdev', 'Stickprovsstandardavvikelse', 's = √(Σ(xᵢ − x̄)² / (n − 1)).', ['spridning', 'varians'], a => { const s = Stat.stdS(a), m = Stat.mean(a); return { val: s, sym: 's', steps: u => [`x̄ = ${fmt(m)}, n = ${a.length}`, `s = √(Σ(x−x̄)² / (n−1)) = ${fmt(s)} ${u}`] }; }, { min: 2 });
calc({ id: 'abs_err', f: 'abs_err', cat: 'meas', title: 'Absolut mätavvikelse', desc: 'Δ = mätt − referens.', syn: ['mätfel', 'avvikelse'],
  inputs: [I('xm', 'Mätt värde', { noConv: 1 }), I('xr', 'Referensvärde', { noConv: 1 }), UNIT_TXT],
  compute(v) { const d = v.xm - v.xr, u = v.unit || ''; return { results: [R('Absolut avvikelse', d, u, 'Δ')], steps: [`Δ = x_mätt − x_ref = ${fmt(v.xm)} − ${fmt(v.xr)}`, `Δ = ${fmt(d)} ${u}`] }; } });
calc({ id: 'rel_err', f: 'rel_err', cat: 'meas', title: 'Relativ mätavvikelse', desc: 'δ = (mätt − referens) / referens · 100 %.', syn: ['procentuellt fel'],
  inputs: [I('xm', 'Mätt värde', { noConv: 1 }), I('xr', 'Referensvärde', { noConv: 1, ne0: 1 })],
  compute(v) { const d = v.xm - v.xr, r = d / v.xr * 100; return { results: [R('Relativ avvikelse', r, '%', 'δ'), R('Absolut avvikelse', d, '', 'Δ')], steps: [`δ = (${fmt(v.xm)} − ${fmt(v.xr)}) / ${fmt(v.xr)} · 100`, `δ = ${fmt(r)} %`] }; } });
calc({ id: 'comb_unc', f: 'comb_unc', cat: 'meas', title: 'Kombinerad standardosäkerhet', desc: 'u_c = √(Σuᵢ²) för oberoende bidrag; valfri utvidgad osäkerhet U = k·u_c.', syn: ['mätosäkerhet', 'osäkerhet', 'gum'],
  inputs: [LIST('x', 'Standardosäkerheter uᵢ (samma enhet)', { noConv: 1, ge0: 1, hint: 'Ett bidrag per rad. Förutsätter okorrelerade bidrag och känslighetskoefficient 1.' }), I('k', 'Täckningsfaktor k', { opt: true, gt0: 1, defVal: 2, noConv: 1, hint: 'Förinställt 2 (≈ 95 % för normalfördelning).' }), UNIT_TXT],
  compute(v) {
    const uc = Math.sqrt(Util.sum(v.x.map(x => x * x))), u = v.unit || '';
    return { results: [R('Kombinerad standardosäkerhet', uc, u, 'u_c'), R('Utvidgad osäkerhet U = k·u_c', v.k * uc, u, 'U')], steps: [`Σuᵢ² = ${fmt(Util.sum(v.x.map(x => x * x)))}`, `u_c = √Σuᵢ² = ${fmt(uc)} ${u}`, `U = ${fmt(v.k)} · ${fmt(uc)} = ${fmt(v.k * uc)} ${u}`], warnings: ['Förutsätter oberoende bidrag. Korrelerade bidrag kräver full GUM-metod (JCGM 100:2008).'] };
  } });
const KINDS = { disp: ['Förskjutning', 'length', 'mm'], vel: ['Hastighet', 'speed', 'mms'], acc: ['Acceleration', 'accel', 'ms2'], press: ['Tryck', 'pressure', 'pa'], other: ['Annan storhet', null, ''] };
calc({ id: 'series', f: 'series', cat: 'meas', also: ['vib'], title: 'Mätserie – nyckeltal, tabell och diagram', desc: 'Medelvärde, RMS, topp, topp-till-topp och standardavvikelse med diagram.', syn: ['vibrationsserie', 'tidsserie', 'logg', 'ppv'],
  inputs: [SEL('kind', 'Storhet', Object.entries(KINDS).map(([k, a]) => [k, a[0]]), { def: 'vel', hint: 'Skilj på förskjutning, hastighet och acceleration – de har olika enheter.' }),
    { id: 'x', type: 'list', label: 'Mätvärden (blanksteg, radbrytning eller semikolon)', min: 1, noConv: 1, unitDyn: { dep: 'kind', groups: Object.fromEntries(Object.entries(KINDS).map(([k, a]) => [k, a[1]])), defs: Object.fromEntries(Object.entries(KINDS).map(([k, a]) => [k, a[2]])) }, hint: 'Exempel: 1,2 3,4 2,2 0,8 4,1' },
    TXT('unitTxt', 'Egen enhet (endast för "Annan storhet")')],
  compute(v) {
    const a = v.x, u = v.kind === 'other' ? (v.unitTxt || '') : (v._ul.x || ''), n = a.length, m = Stat.mean(a), s = Stat.stdS(a);
    const res = [R('Medelvärde', m, u, 'x̄'), R('Standardavvikelse (stickprov)', s, u, 's'), R('RMS', Stat.rms(a), u, 'x_RMS'), R('Toppvärde (max |x|)', Stat.peakAbs(a), u, 'x_topp'), R('Topp-till-topp', Stat.max(a) - Stat.min(a), u, 'x_pp'), R('Min', Stat.min(a), u), R('Max', Stat.max(a), u), R('Antal värden', n, 'st', 'n')];
    const w = [];
    if (/db/i.test(u)) w.push('Värdena är nivåer i dB: aritmetiskt medelvärde, RMS och standardavvikelse av dB-tal är inte energimässigt korrekta, och topptrycksnivåer kan inte medelvärdesbildas energetiskt.');
    if (n > 1) w.push('Om värdena är separata mätningar (t.ex. ett toppvärde per salva) beskriver medel, RMS och standardavvikelse spridningen mellan mätningarna – inte en signal – och ska inte jämföras med krav.');
    if (n < 2) { w.push('Standardavvikelse kräver minst två värden.'); res[1] = RT('Standardavvikelse (stickprov)', '–'); }
    if (v.kind === 'acc') w.push('Acceleration: kontrollera att enheten är m/s², mm/s² eller g – inte hastighet (mm/s).');
    if (v.kind === 'vel' && u === 'm/s' && Stat.peakAbs(a) > 1) w.push('Ovanligt stora hastighetsvärden i m/s – kontrollera att enheten inte ska vara mm/s.');
    return { results: res, steps: [`n = ${n}, x̄ = ${fmt(m)} ${u}`], warnings: w,
      table: { head: ['Nr', 'Värde (' + u + ')', 'Avvikelse från medel'], rows: a.slice(0, 200).map((x, i) => [String(i + 1), fmt(x), fmt(x - m)]), num: [0, 1, 2], note: n > 200 ? `Tabellen visar de första 200 av ${n} värden. Alla värden ingår i beräkningarna och diagrammet.` : '' },
      chart: Charts.line(a.map((_, i) => i + 1), a, { title: 'Mätserie', xlabel: 'Mätpunkt nr', ylabel: u, mean: m }) };
  } });

/* --- Borrning och produktion --- */
calc({ id: 'drill_len', f: 'drill_len', cat: 'drill', title: 'Total borrad längd', desc: 'Summa av hållängder (borrmeter).', syn: ['borrmeter', 'hållängd'],
  inputs: [LIST('L', 'Hållängder (en per rad eller separerade med blanksteg)', { unitGroup: 'length', unit: 'm', ge0: 1 })],
  compute(v) { const t = Util.sum(v.L); return { results: [...multi('Total borrad längd', 'L_tot', t, 'length', ['m']), R('Antal hål', v.L.length, 'st'), R('Medellängd per hål', t / v.L.length, 'm')], steps: [`L_tot = Σ Lᵢ över ${v.L.length} hål = ${fmt(t)} m`], warnings: ['Produktionsuppföljning – ersätter inte dimensionering. Redovisningsprincip (t.ex. överborrning) bestäms av projektet.'] }; } });
calc({ id: 'drill_rate', f: 'drill_rate', cat: 'drill', title: 'Borrmeter per arbetstimme', desc: 'p = L / t.', syn: ['produktivitet', 'penetration'],
  inputs: [I('L', 'Borrad längd', { unitGroup: 'length', unit: 'm', ge0: 1 }), I('t', 'Arbetstid', { unitGroup: 'time', unit: 'h', gt0: 1 })],
  compute(v, c) { const p = v.L / (v.t / 3600); return { results: [R('Borrmeter per arbetstimme', p, 'm/h', 'p')], steps: [`p = L / t = ${c.disp('L')} / ${c.disp('t')}`, `p = ${fmt(p)} m/h`], warnings: ['Ange vilken tidsdefinition (inkl./exkl. stillestånd) som använts.'] }; } });
const HRS = { unitGroup: 'time', unit: 'h' };
const hrs = x => x / 3600;
calc({ id: 'worktime', f: 'worktime', cat: 'drill', title: 'Arbetstid', desc: 'Arbetstid = maskintid + stilleståndstid.', syn: ['skifttid'],
  inputs: [I('tm', 'Maskintid (drift)', { ...HRS, ge0: 1 }), I('ti', 'Stilleståndstid', { ...HRS, ge0: 1 })],
  compute(v) { const w = v.tm + v.ti; return { results: [R('Arbetstid', hrs(w), 'h', 't_arbete'), ...(w > 0 ? [R('Utnyttjandegrad (maskintid/arbetstid)', 100 * v.tm / w, '%')] : [])], steps: [`t_arbete = ${fmt(hrs(v.tm))} + ${fmt(hrs(v.ti))} = ${fmt(hrs(w))} h`] }; } });
calc({ id: 'machtime', f: 'machtime', cat: 'drill', title: 'Maskintid', desc: 'Maskintid = arbetstid − stilleståndstid.', syn: ['drifttid'],
  inputs: [I('tw', 'Arbetstid', { ...HRS, ge0: 1 }), I('ti', 'Stilleståndstid', { ...HRS, ge0: 1 })],
  compute(v) { if (v.ti > v.tw) throw new CalcError('Stilleståndstiden kan inte vara längre än arbetstiden.', 'ti'); const m = v.tw - v.ti; return { results: [R('Maskintid', hrs(m), 'h', 't_maskin'), ...(v.tw > 0 ? [R('Utnyttjandegrad', 100 * m / v.tw, '%')] : [])], steps: [`t_maskin = ${fmt(hrs(v.tw))} − ${fmt(hrs(v.ti))} = ${fmt(hrs(m))} h`] }; } });
calc({ id: 'downtime', f: 'downtime', cat: 'drill', title: 'Stilleståndstid', desc: 'Stillestånd = arbetstid − maskintid.', syn: ['driftstopp', 'väntetid'],
  inputs: [I('tw', 'Arbetstid', { ...HRS, ge0: 1 }), I('tm', 'Maskintid', { ...HRS, ge0: 1 })],
  compute(v) { if (v.tm > v.tw) throw new CalcError('Maskintiden kan inte vara längre än arbetstiden.', 'tm'); const d = v.tw - v.tm; return { results: [R('Stilleståndstid', hrs(d), 'h', 't_stillestånd'), ...(v.tw > 0 ? [R('Andel stillestånd', 100 * d / v.tw, '%')] : [])], steps: [`t_stillestånd = ${fmt(hrs(v.tw))} − ${fmt(hrs(v.tm))} = ${fmt(hrs(d))} h`] }; } });
calc({ id: 'fuel_h', f: 'fuel_h', cat: 'drill', title: 'Bränsle per maskintimme', desc: 'q = V / t_maskin.', syn: ['diesel', 'förbrukning'],
  inputs: [I('V', 'Förbrukat bränsle', { unitGroup: 'volume', unit: 'l', ge0: 1 }), I('t', 'Maskintid', { ...HRS, gt0: 1 })],
  compute(v, c) { const q = v.V * 1000 / hrs(v.t); return { results: [R('Bränsle per maskintimme', q, 'l/h', 'q_h')], steps: [`q = V / t = ${c.disp('V')} / ${c.disp('t')}`, `q = ${fmt(q)} l/h`] }; } });
calc({ id: 'fuel_unit', f: 'fuel_unit', cat: 'drill', title: 'Bränsle per producerad enhet', desc: 'q = V / P.', syn: ['diesel per kubik', 'diesel per meter'],
  inputs: [I('V', 'Förbrukat bränsle', { unitGroup: 'volume', unit: 'l', ge0: 1 }), I('P', 'Producerad mängd', { noConv: 1, gt0: 1 }), TXT('unit', 'Enhet för produktion', { hint: 'T.ex. m³, borrmeter eller ton.' })],
  compute(v) { const q = v.V * 1000 / v.P, u = v.unit || 'enhet'; return { results: [R('Bränsle per ' + u, q, 'l/' + u, 'q')], steps: [`q = ${fmt(v.V * 1000)} l / ${fmt(v.P)} ${u} = ${fmt(q)} l/${u}`] }; } });
calc({ id: 'plan_act', f: 'plan_act', cat: 'drill', title: 'Planerad mot faktisk produktion', desc: 'Avvikelse och måluppfyllelse.', syn: ['utfall', 'avvikelse'],
  inputs: [I('P0', 'Planerad produktion', { noConv: 1, gt0: 1 }), I('P1', 'Faktisk produktion', { noConv: 1, ge0: 1 }), TXT('unit', 'Enhet', { hint: 'T.ex. m, m³ eller ton.' })],
